<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--artifact:start-->
<title>Clack</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Move your cursor and every step clicks, pops or squishes. Ten stress-relief sounds, each with its own graphic to play with.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a full-screen canvas scene sits under a slim header and a dock, each set in a soft frost with no edge.
   Every sound has its own scene and its own palette, most drawn from one moodboard:
   cobalt, periwinkle, grey paper, warm paper and ink. */
:root {
  --cobalt: #2c62fb; --peri: #becdf9; --mid: #5c80ea; --paper: #f3eee6; --grey-paper: #e6e6e3; --ink-black: #1c1c1c;
  --bg: #f4f5f7; --ink: #1b2a6b; --ink-soft: #5a6890; --line: rgba(27,42,107,.14); --panel: rgba(255,255,255,.84);
  --acc: var(--cobalt); --cursor: var(--cobalt); --frost: 60%;
  --font-ui: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: light;
}
body[data-scene="wrap"]   { --bg: #69bca9; --ink: #164a3f; --ink-soft: #2a6156; --line: rgba(22,74,63,.16); --panel: rgba(236,242,239,.9); --acc: #eef2ef; --cursor: #164a3f; color-scheme: light; }
body[data-scene="cyano"]  { --bg: #3557b0; --ink: #f2f5ff; --ink-soft: #c3d0f5; --line: rgba(242,245,255,.25); --panel: rgba(40,70,150,.9); --acc: #f2f5ff; --cursor: #f2f5ff; color-scheme: dark; }
body[data-scene="cloth"]  { --bg: #e6e6e6; --ink: #1a1a1a; --ink-soft: #6a6a6a; --line: rgba(26,26,26,.14); --panel: rgba(244,244,244,.88); --acc: #1a1a1a; --cursor: #1a1a1a; color-scheme: light; }
body[data-scene="wax"]    { --bg: #181818; --ink: #f4f4f0; --ink-soft: #a5a5a0; --line: rgba(244,244,240,.2); --panel: rgba(30,30,30,.9); --acc: #f4f4f0; --cursor: #ffffff; --frost: 90%; color-scheme: dark; }
body[data-scene="laser"]  { --bg: #d3d5d7; --ink: #27313d; --ink-soft: #66717f; --line: rgba(39,49,61,.14); --panel: rgba(232,234,236,.88); --acc: #27313d; --cursor: #46576b; color-scheme: light; }
body[data-scene="gummy"]  { --bg: #efe6d8; --ink: #8f1029; --ink-soft: #8a6f5c; --line: rgba(143,16,41,.15); --panel: rgba(247,241,232,.9); --acc: #e8344e; --cursor: #8f1029; color-scheme: light; }
body[data-scene="jelly"]  { --bg: #eed9b1; --ink: #17690a; --ink-soft: #7d6b45; --line: rgba(23,105,10,.16); --panel: rgba(244,231,205,.9); --acc: #f31802; --cursor: #17690a; color-scheme: light; }
body[data-scene="soap"]   { --bg: #f2f7fc; --ink: #2b5f9f; --ink-soft: #6f8fb8; --line: rgba(43,95,159,.15); --panel: rgba(244,248,253,.9); --acc: #2b5f9f; --cursor: #2b5f9f; color-scheme: light; }
body[data-scene="snow"]   { --bg: #f6f8fd; --ink: #2c62fb; --ink-soft: #6f86c4; --line: rgba(44,98,251,.16); --panel: rgba(246,248,253,.9); --acc: #2c62fb; --cursor: #2c62fb; color-scheme: light; }
body[data-scene="grit"]   { --bg: #becdf9; --ink: #1d3fae; --ink-soft: #4f68b8; --line: rgba(29,63,174,.18); --panel: rgba(222,230,252,.9); --acc: #2c62fb; --cursor: #2c62fb; color-scheme: light; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--bg);
  color: var(--ink); font-family: var(--font-ui);
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  touch-action: none; transition: background-color .4s;
}
body.custom-cursor, body.custom-cursor * { cursor: none !important; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; display: block; }

.app {
  position: relative; z-index: 1; height: 100%;
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none; overflow: clip; /* the frosts at the screen's edges don't widen the page */
}
.top, .dock-wrap { pointer-events: auto; }

/* Header */
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding-block: 16px 6px; }
.brand { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
.brand h1 { margin: 0; font: 800 28px/1 var(--font-ui); letter-spacing: -.04em; color: var(--ink); }
.brand h1 sup { font: 500 10px/1 var(--font-mono); letter-spacing: 0; vertical-align: top; margin-left: 2px; color: var(--ink-soft); }
.brand p { margin: 0; font: 500 12px/1.3 var(--font-mono); color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tally { text-align: right; line-height: 1.1; font-family: var(--font-mono); }
.tally b { display: block; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tally span { font-size: 11px; letter-spacing: .08em; color: var(--ink-soft); }
.stage { min-height: 0; min-width: 0; }

/* custom cursor + trail canvas: a ring in each picture's own --cursor color */
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
.cursor {
  position: fixed; left: 0; top: 0; z-index: 50; pointer-events: none; color: var(--cursor);
  width: 30px; height: 30px; margin: -15px 0 0 -15px;
  filter: drop-shadow(0 2px 3px rgba(0,0,0,.2)); will-change: transform; opacity: 0; transition: opacity .2s;
}
.cursor.on { opacity: 1; }
/* on the black and white halftone the ring inverts whatever is under it, so it shows on both */
body[data-scene="wax"] .cursor { mix-blend-mode: difference; filter: none; }
.cursor svg { width: 100%; height: 100%; display: block; transition: transform 90ms ease-out; }
.cursor.press svg { transform: scale(.78); transition-duration: 30ms; }

/* Dock */
.dock-wrap { position: relative; z-index: 20; display: flex; justify-content: center; padding-bottom: max(14px, env(safe-area-inset-bottom, 0px)); padding-top: 6px; }
.dock { position: relative; isolation: isolate; display: flex; align-items: center; gap: 4px; padding: 6px; max-width: 100%; }
/* the logo, the tally and the dock have no panel: each sits in a frost of the page colour that fades out into the
   picture with no edge, --fx and --fy past it on each side. On the black and white halftone a pale frost reads as a
   grey smudge, so there --frost is dark, like the pools under the logo */
.brand, .tally { position: relative; isolation: isolate; --fx: 40px; --fy: 22px; }
.brand::before, .tally::before, .dock::before {
  content: ""; position: absolute; z-index: -1; pointer-events: none;
  inset: calc(-1 * var(--fy, 30px)) calc(-1 * var(--fx, 64px));
  background: color-mix(in srgb, var(--bg) var(--frost), transparent);
  backdrop-filter: blur(12px) saturate(1.2); -webkit-backdrop-filter: blur(12px) saturate(1.2);
  --m: linear-gradient(to right, transparent, #000 var(--fx, 64px), #000 calc(100% - var(--fx, 64px)), transparent),
       linear-gradient(transparent, #000 var(--fy, 30px), #000 calc(100% - var(--fy, 30px)), transparent);
  -webkit-mask-image: var(--m); -webkit-mask-composite: source-in; mask-image: var(--m); mask-composite: intersect;
}
.seg { display: flex; background: var(--line); border-radius: 999px; padding: 3px; flex: none; }
.seg button, .dbtn {
  font: 500 13px/1 var(--font-ui); color: var(--ink); background: transparent; border: 0;
  display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; flex: none;
  padding: 9px 13px; border-radius: 999px; cursor: pointer; transition: background .15s, color .15s;
}
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.dbtn:hover, .dbtn[aria-expanded="true"] { background: var(--line); }
.dbtn em { font: 500 11px/1 var(--font-mono); font-style: normal; color: var(--ink-soft); }
.dbtn.step { padding: 9px 10px; }
.dbtn svg, .seg svg { width: 16px; height: 16px; flex: none; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
.sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; flex: none; }
.vol { display: flex; align-items: center; gap: 6px; padding-right: 8px; flex: none; }
input[type="range"] { accent-color: var(--ink); width: 92px; }

/* Panels */
.panel {
  position: absolute; bottom: calc(100% + 4px); left: 50%; transform: translateX(-50%);
  width: min(760px, calc(100vw - 32px)); max-height: min(78vh, 700px); overflow: auto;
  padding: 18px; border-radius: 22px; background: var(--panel); border: 1px solid var(--line);
  backdrop-filter: blur(22px) saturate(1.3); -webkit-backdrop-filter: blur(22px) saturate(1.3);
  box-shadow: 0 20px 50px rgba(10,20,60,.2); animation: rise .18s ease-out;
}
@keyframes rise { from { opacity: 0; transform: translate(-50%, 8px); } }
.panel h2 { margin: 0 0 12px; font: 500 11px/1 var(--font-mono); letter-spacing: .12em; color: var(--ink-soft); }
.panel h2 + * { margin-bottom: 18px; }
.panel > :last-child { margin-bottom: 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; }
#soundGrid { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
#soundGrid .thumb { aspect-ratio: 2 / 1; }
@media (max-width: 640px) { #soundGrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.opt {
  text-align: left; font: inherit; color: var(--ink); cursor: pointer;
  padding: 8px; border-radius: 14px; border: 1px solid var(--line); background: transparent;
  display: flex; flex-direction: column; gap: 4px; transition: border-color .15s, background .15s;
}
.opt:hover { background: var(--line); }
.opt[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.opt b { font-size: 13px; font-weight: 600; display: flex; gap: 6px; align-items: baseline; padding: 2px 2px 0; }
.opt b em { font: 500 10px/1 var(--font-mono); font-style: normal; color: var(--ink-soft); }
.opt > span:last-child { font-size: 11px; line-height: 1.35; color: var(--ink-soft); padding: 0 2px 2px; }
.thumb { display: block; border-radius: 9px; overflow: hidden; aspect-ratio: 8 / 5; box-shadow: inset 0 0 0 1px rgba(0,0,0,.06); }
.thumb svg { width: 100%; height: 100%; display: block; }

/* Intro */
.intro {
  position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; text-align: center;
  background: color-mix(in srgb, var(--bg) 62%, transparent);
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.intro-card { max-width: 460px; display: grid; justify-items: center; gap: 14px; }
.intro h2 { position: relative; margin: 0; font: 800 clamp(72px, 16vw, 132px)/.9 var(--font-ui); letter-spacing: -.05em; color: var(--ink); }
.intro h2::before { content: "clack"; position: absolute; inset: 0; color: var(--acc); filter: blur(18px); opacity: .55; transform: translate(.06em, .06em); z-index: -1; }
.intro small { font: 500 11px/1 var(--font-mono); letter-spacing: .14em; color: var(--ink-soft); }
.intro p { margin: 0; font-size: 15px; line-height: 1.6; color: var(--ink-soft); text-wrap: balance; }
.go { margin-top: 6px; font: 600 16px/1 var(--font-ui); padding: 16px 28px; border-radius: 999px; border: 0; background: var(--ink); color: var(--bg); cursor: pointer; box-shadow: 0 10px 24px rgba(10,20,60,.22); }

@media (max-width: 720px) {
  .brand p { display: none; }
  .seg button { padding: 9px 11px; }
  input[type="range"] { width: 64px; }
  .tally b { font-size: 18px; }
  .brand h1 { font-size: 24px; }
}
@media (max-width: 520px) { .vol input, .dbtn.step { display: none; } }
@media (max-height: 520px) {
  .top { padding-block: 8px 2px; }
  .brand p { display: none; }
  .dock-wrap { padding-bottom: max(8px, env(safe-area-inset-bottom, 0px)); padding-top: 4px; }
  .dock { padding: 4px; }
  .seg button, .dbtn { padding: 7px 10px; }
}
@media (prefers-reduced-motion: reduce) { .panel { animation: none; } }
</style>
</head>
<body>
<canvas id="scene" aria-label="Interactive graphic. Move your cursor to play"></canvas>
<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <h1>clack<sup>10</sup></h1>
    </div>
    <div class="tally" aria-live="off">
      <b id="count">0</b>
      <span>CLACKS</span>
    </div>
  </header>

  <main class="stage" id="stage"></main>

  <div class="dock-wrap" id="dockWrap">
    <nav class="dock" id="dock" aria-label="Settings">
      <button class="dbtn step" id="prev" type="button" aria-label="Previous sound"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg></button>
      <button class="dbtn" type="button" data-panel="sound" aria-expanded="false">
        <em id="soundNum">01</em><span id="soundName"></span>
      </button>
      <button class="dbtn step" id="next" type="button" aria-label="Next sound"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button>
      <span class="sep"></span>
      <div class="vol">
        <button class="dbtn" id="mute" type="button" aria-label="Mute" style="padding:9px"></button>
        <input id="volume" type="range" min="0" max="1" step="0.01" aria-label="Volume">
      </div>
    </nav>

    <section class="panel" id="panel-sound" hidden aria-label="Choose a sound">
      <h2>10 SOUNDS, 10 PICTURES</h2>
      <div class="grid" id="soundGrid"></div>
    </section>
  </div>
</div>

<canvas id="fx" aria-hidden="true"></canvas>
<div class="cursor" id="cursor" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/></svg></div>

<div class="intro" id="intro">
  <div class="intro-card">
    <small>A TOY ABOUT DOING NOTHING</small>
    <h2>clack</h2>
    <p>Move your cursor and every step clicks, pops or squishes.<br>Ten sounds, ten pictures to crack, squish and crunch.</p>
    <button class="go" id="go" type="button">Turn on sound &amp; start</button>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);

/* ---------- settings ---------- */
const SOUND_IDS = ['bubble', 'slime', 'cyano', 'wax', 'thock', 'gummy', 'pudding', 'soap', 'snow', 'sugar'];
const DEF = { mode: 'hover', sound: 'bubble', volume: 0.7, muted: false, count: 0 };
let S = { ...DEF };
try { Object.assign(S, JSON.parse(localStorage.getItem('clack') || '{}')); } catch (e) {}
S.sound = DEF.sound; // every visit opens on 01 Bubble Wrap; the other settings are remembered
S.mode = 'hover'; // Tap mode was removed: sounds always play as the cursor moves (touch screens still drag)
let saveT = 0;
function save() {
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    try { const { mode, sound, volume, muted, count } = S; localStorage.setItem('clack', JSON.stringify({ mode, sound, volume, muted, count })); } catch (e) {}
  }, 300);
}

/* ---------- audio ---------- */
const A = { ctx: null };
function makeIR(C, secs, decay) {
  const len = Math.floor(C.sampleRate * secs), b = C.createBuffer(2, len, C.sampleRate);
  for (let ch = 0; ch < 2; ch++) { const d = b.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay); }
  return b;
}
function initAudio(C) {
  if (A.ctx && !C) { if (A.ctx.state === 'suspended') A.ctx.resume(); return; }
  C = C || new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
  A.ctx = C;
  A.master = C.createGain(); A.master.gain.value = S.muted ? 0 : S.volume;
  const comp = C.createDynamicsCompressor();
  comp.threshold.value = -16; comp.knee.value = 10; comp.ratio.value = 5; comp.attack.value = 0.002; comp.release.value = 0.15;
  A.dry = C.createGain(); A.dry.gain.value = 1.9; A.dry.connect(comp);
  A.wet = C.createGain(); A.wet.gain.value = 1.1;
  const verb = C.createConvolver(); verb.buffer = makeIR(C, 2.4, 3.4);
  A.wet.connect(verb); verb.connect(comp);
  // a gentle top-end roll-off keeps the tingle soft instead of sharp
  const soft = C.createBiquadFilter(); soft.type = 'lowpass'; soft.frequency.value = 10500; soft.Q.value = 0.5;
  comp.connect(soft); soft.connect(A.master); A.master.connect(C.destination);
  const n = C.createBuffer(1, C.sampleRate, C.sampleRate), d = n.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  A.noise = n;
}
function env(v, t, a, d, g) {
  v.gain.setValueAtTime(0.0001, t);
  v.gain.exponentialRampToValueAtTime(g, t + a);
  v.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
}
function out(v, wet) {
  v.connect(A.dry);
  if (wet) { const s = A.ctx.createGain(); s.gain.value = wet; v.connect(s); s.connect(A.wet); }
}
function tone(type, f, t, o = {}) {
  const { a = 0.002, d = 0.1, g = 0.5, f2 = 0, ft = 0.05, wet = 0 } = o;
  const C = A.ctx, osc = C.createOscillator(), v = C.createGain();
  osc.type = type; osc.frequency.setValueAtTime(f, t);
  if (f2) osc.frequency.exponentialRampToValueAtTime(f2, t + ft);
  env(v, t, a, d, g); osc.connect(v); out(v, wet);
  osc.start(t); osc.stop(t + a + d + 0.05);
}
function hiss(t, o = {}) {
  const { type = 'bandpass', f = 2000, q = 1, a = 0.001, d = 0.03, g = 0.5, f2 = 0, ft = 0.05, wet = 0 } = o;
  const C = A.ctx, s = C.createBufferSource(), fl = C.createBiquadFilter(), v = C.createGain();
  s.buffer = A.noise; s.playbackRate.value = 0.9 + Math.random() * 0.2;
  fl.type = type; fl.frequency.setValueAtTime(f, t); if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + ft); fl.Q.value = q;
  env(v, t, a, d, g); s.connect(fl); fl.connect(v); out(v, wet);
  s.start(t, Math.random() * 0.5); s.stop(t + a + d + 0.05);
}
// a tone whose pitch shivers with a fading vibrato, for anything that jiggles
function wobble(f, t, o = {}) {
  const { a = 0.006, d = 0.25, g = 0.5, rate = 9, depth = 0.1, f2 = 0, ft = 0.08, wet = 0 } = o;
  const C = A.ctx, osc = C.createOscillator(), lfo = C.createOscillator(), lg = C.createGain(), v = C.createGain();
  osc.frequency.setValueAtTime(f, t); if (f2) osc.frequency.exponentialRampToValueAtTime(f2, t + ft);
  lfo.frequency.value = rate; lg.gain.setValueAtTime(f * depth, t); lg.gain.exponentialRampToValueAtTime(f * depth * 0.05, t + a + d);
  lfo.connect(lg); lg.connect(osc.frequency);
  env(v, t, a, d, g); osc.connect(v); out(v, wet);
  osc.start(t); lfo.start(t); osc.stop(t + a + d + 0.05); lfo.stop(t + a + d + 0.05);
}
const rand = (a, b) => a + Math.random() * (b - a);

/* Each sound: scene = the picture it draws, desc = one line for the picker.
   All are tuned for ASMR: soft attacks, rounded filters, tiny crisp details and a little room tone.
*/
function crinkle(t, n, spread, o = {}) {
  const { lo = 2600, hi = 6000, g = 0.35, q = 2.5, a = 0.0015, d = 0.012 } = o;
  for (let i = 0; i < n; i++) { const at = t + Math.pow(Math.random(), 1.6) * spread; hiss(at, { f: rand(lo, hi), q, a, d: rand(d / 3, d), g: rand(0.4, 1) * g * (1 - (at - t) / spread * 0.6) }); }
}
const SOUNDS = {
  bubble: { name: 'Bubble Wrap', desc: 'Pop pale rings on mint', scene: 'wrap', noTrail: true,
    // a gentle, muffled pop that sounds like a drop of water: its note swoops up as the bubble bursts (the bloop), and
    // now and then a smaller droplet plinks after it
    down(k, t, j) {
      const f0 = (210 + k.seed * 120) * j;
      hiss(t, { type: 'lowpass', f: 1200, q: 0.7, a: 0.003, d: 0.012, g: 0.45 });
      tone('sine', f0, t, { f2: f0 * 2.2, ft: 0.045, a: 0.005, d: 0.09, g: 0.3, wet: 0.08 });
      if (Math.random() < 0.4) {
        const f1 = f0 * rand(2, 2.6);
        tone('sine', f1, t + rand(0.05, 0.1), { f2: f1 * 1.7, ft: 0.025, a: 0.003, d: 0.035, g: 0.06, wet: 0.1 });
      }
    } },
  slime: { name: 'Crunchy Slime', desc: 'Crumple a sheet of stitches', scene: 'cloth', noTrail: true,
    // foam beads bursting inside glossy slime: a wet press and a fizz of tiny crackles
    down(k, t, j) {
      hiss(t, { f: 380 * j, f2: 700, ft: 0.1, q: 6, a: 0.025, d: 0.14, g: 1, wet: 0.08 });

const stage = $('stage');

const ALNUM = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
function cellAt(x, y) {

  const ci = Math.floor(x / CELL), cj = Math.floor(y / CELL), id = ci + ',' + cj;
  let k = cells.get(id);

    const h = Math.abs(Math.sin(ci * 12.9898 + cj * 78.233) * 43758.5453) % 1, ch = ALNUM[((ci * 7 + cj * 13) % 36 + 36) % 36];
    k = { code: 'Cell', label: ch, en: ch, x: clamp((ci + .5) * CELL / SW * 15, 0, 14.9), row: clamp(Math.floor((cj + .5) * CELL / SH * 6), 0, 5),
      seed: h, holders: new Set(), downAt: 0 };
    cells.set(id, k);

}

const physKeys = {};

  if (m) { label = m[1]; row = KB_ROWS.findIndex(r => r.includes(label)); col = KB_ROWS[row].indexOf(label) + row * .35; }
  else if (code === 'Space') { row = 4; col = 4.5; label = ' '; }

  return physKeys[code] = { code, label, en: label === ' ' ? '' : label, x: col * 15 / 11, row, seed: Math.random(), holders: new Set(), downAt: 0,
    fx: (.08 + .84 * (col + .5) / 11), fy: (.12 + .76 * (row + .5) / 5) };
}

/* ---------- press / release ---------- */
const countEl = $('count');
function press(k, src) {

/* ---------- pointer input ---------- */
const active = new Map();   // pointerId -> cell under it
const lastPt = new Map();
const pressed = new Set();
function keyAt(x, y) {

}

}
function travel(id, x1, y1) {

  const dx = x1 - p[0], dy = y1 - p[1], dist = Math.hypot(dx, dy);
  const n = Math.min(48, Math.ceil(dist / Math.max(4, CELL * 0.4)));
  if (!n) return enter(id, keyAt(x1, y1));
  for (let i = 1; i <= n; i++) enter(id, keyAt(p[0] + dx * i / n, p[1] + dy * i / n));
}
const glides = e => e.pointerType !== 'mouse' && e.pointerType !== 'pen' ? pressed.has(e.pointerId) : (S.mode === 'hover' || pressed.has(e.pointerId));

addEventListener('pointerdown', e => {

  enter(e.pointerId, k);

  if (scene && scene.move && !inUI(e.target)) { const p = lastPt.get(e.pointerId) || [e.clientX, e.clientY]; const x = e.clientX - FX, y = e.clientY - FY; if (x > -20 && x < SW + 20 && y > -20 && y < SH + 20) scene.move(x, y, e.clientX - p[0], e.clientY - p[1]); }
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];

function lift(e) {

}
addEventListener('pointerup', lift);
addEventListener('pointercancel', lift);
document.addEventListener('pointerleave', e => { enter(e.pointerId, null); lastPt.delete(e.pointerId); cursorEl.classList.remove('on'); });
document.documentElement.addEventListener('mouseleave', () => { releaseAll('p'); cursorEl.classList.remove('on'); });
addEventListener('blur', () => releaseAll());
addEventListener('contextmenu', e => { if (e.target === scn) e.preventDefault(); });

/* real keyboard: letters, digits, space and enter play too; arrows switch sounds */
addEventListener('keydown', e => {
  const t = e.target;
  if (t && t.tagName === 'INPUT' && t.type !== 'range') return;
  if (e.code === 'Escape') return closePanels();

  if (e.metaKey || e.ctrlKey || e.altKey) return;

/* ---------- drawing helpers ---------- */
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const mono = (sz, w = 500) => `${w} ${sz}px "IBM Plex Mono", ui-monospace, monospace`;
const C = { cobalt: '#2c62fb', peri: '#becdf9', ink: '#1c1c1c', paper: '#f3eee6', greyPaper: '#e6e6e3' };
function grainFill(w, h, alpha) {
  const t = document.createElement('canvas'); t.width = w; t.height = h;
  const ctx = t.getContext('2d'), img = ctx.createImageData(w, h), d = img.data;
  for (let i = 0; i < d.length; i += 4) { const v = Math.random() * 255; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = Math.random() * 255 * alpha; }

  if (spacing) { let cx = x; for (const ch of text) { ctx.fillText(ch, cx, y); cx += spacing; } } else ctx.fillText(text, x, y);

/* ---------- scenes: init() paints the static deco layer, hit() reacts to a step, draw() runs every frame ---------- */
const SCENES = {
  /* 01 Bubble Wrap: the sheet drawn as a contour map in pale grey on mint paper, after a photo. Every bubble is a
     hill of rings: big droplets of mixed sizes packed close, each nudged off its row and stretched and tilted its own
     way, so no two match; where two press together their rings meet in a crease. The sheet sways gently, and a pop
     flattens its hill and sends a ripple through the neighbours' rings. */
  wrap: {
    frame: 'full',
    init() {
      const G = this.G = 2, w = this.w = Math.ceil(SW / G), h = this.h = Math.ceil(SH / G);
      this.off = this.off || document.createElement('canvas'); this.off.width = w; this.off.height = h;
      this.oc = this.off.getContext('2d'); this.img = this.oc.createImageData(w, h); this.px = new Uint32Array(this.img.data.buffer);
      this.F = new Float32Array(w * h); this.w2 = (w >> 1) + 2; this.h2 = (h >> 1) + 2; this.K = new Float32Array(this.w2 * this.h2);
      const s2 = this.s = clamp(Math.round(Math.min(SW, ZB - ZT) / 7.5), 52, 120);
      // bubbles sit in rows a cell apart, each row slid sideways by its own amount, packed so they fill the sheet. Every
      // bubble is nudged off its spot and gets its own size, stretch and tilt, and a few are smaller droplets; bigger
      // ones stand taller, so they carry more rings, and no peak sits just over a ring's level, where that ring would
      // shrink to a speck. None reaches further than .85 of a cell from its centre, the furthest draw() looks for it
      const cols = this.cols = Math.ceil(SW / s2) + 4, rows = this.rows = Math.ceil(SH / s2) + 4, n = cols * rows;
      this.ro = Float32Array.from({ length: rows }, Math.random);
      this.bx = new Float32Array(n); this.by = new Float32Array(n); this.ca = new Float32Array(n); this.sa = new Float32Array(n);
      this.irx = new Float32Array(n); this.iry = new Float32Array(n);
      this.amp = new Float32Array(n); this.base = new Float32Array(n); this.back = new Float64Array(n);
      for (let j = 0, q = 0; j < rows; j++) for (let i = 0; i < cols; i++, q++) {
        const R = Math.random() < .1 ? rand(.34, .46) : rand(.6, .85), e = rand(.8, 1.25), a = rand(0, Math.PI);
        this.bx[q] = i + this.ro[j] + rand(-.15, .15); this.by[q] = j + rand(-.15, .15);
        this.ca[q] = Math.cos(a); this.sa[q] = Math.sin(a);
        this.irx[q] = 1 / Math.min(.85, R * e); this.iry[q] = 1 / Math.min(.85, R / e);
        let A = clamp(.35 + .85 * R, .5, 1) * rand(.92, 1);
        for (const L of [.375, .625, .875]) if (A > L - .02 && A < L + .07) A = L + .07;
        this.amp[q] = this.base[q] = A;
      }
      this.x0 = this.y0 = -s2 * 1.5;
      this.rip = []; this.cur = { x: -999, y: -999, a: 0, t: 0 };
      this.M = new Float32Array(w * h); this.mk = ''; this.mt = 0;
      paper(dc, '#69bca9', .07);
    },
    // the sheet flattens around the logo, the tally and the dock, so the rings close into rounded ends and part
    // around them instead of running under the text. Rebuilt whenever one of them moves or grows (the tally gains digits)
    ui() {
      const rs = [...document.querySelectorAll('.brand, .tally, #dock')].map(e => e.getBoundingClientRect()).filter(r => r.width);
      const key = rs.map(r => [r.left, r.top, r.right, r.bottom].map(Math.round).join()).join('|');
      if (key === this.mk) return;
      this.mk = key;
      const G = this.G, w = this.w, h = this.h, M = this.M, pad = 8, ramp = this.s * 1.1;
      M.fill(1);
      for (const r of rs) {
        // each element is kept clear by a capsule around it: the distance to its middle segment, less its half-height
        const rr = Math.min(r.width, r.height) / 2, l = r.left - FX + rr, t = r.top - FY + rr, R = r.right - FX - rr, B = r.bottom - FY - rr, reach = rr + pad + ramp;
        const i0 = Math.max(0, Math.floor((l - reach) / G)), i1 = Math.min(w - 1, Math.ceil((R + reach) / G)), j0 = Math.max(0, Math.floor((t - reach) / G)), j1 = Math.min(h - 1, Math.ceil((B + reach) / G));
        for (let j = j0; j <= j1; j++) for (let i = i0, o = j * w + i0; i <= i1; i++, o++) {
          const x = i * G, y = j * G, q = clamp((Math.hypot(Math.max(l - x, 0, x - R), Math.max(t - y, 0, y - B)) - rr - pad) / ramp, 0, 1);

    },
    move(x, y) { this.cur.x = x; this.cur.y = y; this.cur.t = performance.now(); },
    // the sheet sways: rows slide sideways (ox) and columns bob (oy), so the rows stretch into soft, uneven loops; and
    // the hills stretch wider toward the sides (xs), as if the sheet were pulled from the middle
    ox(y, t) { const s = this.s; return s * (.2 * Math.sin(y / s * 1.9 + t * .35) + .08 * Math.sin(y / s * .53 - t * .2)); },
    oy(x, t) { const s = this.s; return s * (.12 * Math.sin(x / s * 1.3 - t * .3) + .06 * Math.sin(x / s * .41 + t * .25)); },
    xs(x) { const d = x - SW / 2; return SW / 2 + d * (1 - .28 * Math.abs(d) / SW); },
    // how far sheet point (u, v) sits from bubble q's centre, squared, in units of its radius along each of its axes
    d2(q, u, v) {

    for (const [x0, y0, x1, y1, rx, ry, rw, rh] of [[0, 0, F, 0, 0, 0, F, SH], [SW, 0, SW - F, 0, SW - F, 0, F, SH], [0, 0, 0, F, 0, 0, SW, F], [0, SH, 0, SH - F, 0, SH - F, SW, F]]) {
      const g = sc.createLinearGradient(x0, y0, x1, y1);
      g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(.35, 'rgba(0,0,0,.6)'); g.addColorStop(1, 'rgba(0,0,0,0)');

}
requestAnimationFrame(sceneLoop);

/* ---------- cursor trail ---------- */
const fx = $('fx'), g2 = fx.getContext('2d');
let DPR = 1, trail = [], raf = 0;

function cssVar(n) { return getComputedStyle(document.body).getPropertyValue(n).trim(); }
function frame(now) {
  raf = 0;
  g2.setTransform(DPR, 0, 0, DPR, 0, 0);
  g2.clearRect(0, 0, innerWidth, innerHeight);
  trail = trail.filter(p => now - p.t < 260);
  for (let i = 1; i < trail.length; i++) {
    const p = trail[i], q = trail[i - 1], a = 1 - (now - p.t) / 260;
    if (Math.abs(p.x - q.x) + Math.abs(p.y - q.y) > 240) continue;
    g2.strokeStyle = curCache; g2.globalAlpha = a * .55; g2.lineCap = 'round';
    g2.lineWidth = Math.max(1, 7.5 * a); // a quarter of the 30px cursor
    g2.beginPath(); g2.moveTo(q.x, q.y); g2.lineTo(p.x, p.y); g2.stroke();
  }
  g2.globalAlpha = 1;
  if (trail.length) loop();
}
function loop() { if (!raf) raf = requestAnimationFrame(frame); }

/* ---------- custom cursor: always the ring, colored to match the picture ---------- */
const cursorEl = $('cursor');
function curColor() { return cssVar('--cursor') || '#2c62fb'; }
let curCache = '#2c62fb';
function applyCursor() {
  const custom = matchMedia('(any-pointer: fine)').matches;
  document.body.classList.toggle('custom-cursor', custom);
  cursorEl.hidden = !custom;
  curCache = curColor();
}
function moveCursor(e) {
  if (e.pointerType !== 'mouse' && e.pointerType !== 'pen') return;
  cursorEl.style.transform = `translate3d(${e.clientX}px, ${e.clientY}px, 0)`;
  cursorEl.classList.add('on');
  if (!SOUNDS[S.sound].noTrail) { trail.push({ x: e.clientX, y: e.clientY, t: performance.now() }); if (trail.length > 60) trail.shift(); loop(); }
}
let pulseT = 0;
function pulseCursor() { cursorEl.classList.add('press'); clearTimeout(pulseT); pulseT = setTimeout(() => cursorEl.classList.remove('press'), 80); }

/* ---------- picker thumbnails: tiny SVG sketches of each scene ---------- */
function thumb(id) {
  let seed = id.length * 97 + 13; const r = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const svg = (bg, body) => `<svg viewBox="0 0 80 50" preserveAspectRatio="xMidYMid slice"><rect width="80" height="50" fill="${bg}"/>${body}</svg>`;
  let b = '';
  switch (id) {
    case 'bubble':
      // big droplets of mixed sizes in loose rows, each a few rings stretched and tilted its own way
      for (let j = 0; j < 5; j++) for (let i = 0; i < 7; i++) {
        const R = r() < .1 ? 3 + r() * 1.5 : 5 + r() * 3, e = .8 + r() * .45, a = (r() * 180).toFixed(0);
        const x = (i * 13 + (j % 2) * 6 + (r() - .5) * 3).toFixed(1), y = (1 + j * 12 + (r() - .5) * 3).toFixed(1);
        for (let k = 0, n = R > 6 ? 3 : 2; k < n; k++) b += `<ellipse cx="${x}" cy="${y}" rx="${(R * e * (1 - k * .3)).toFixed(1)}" ry="${(R / e * (1 - k * .3)).toFixed(1)}" transform="rotate(${a} ${x} ${y})"/>`;
      }
      return svg('#69bca9', `<g fill="none" stroke="#dfe3e0" stroke-width=".7">${b}</g>`);
    case 'slime':
      for (let j = 0; j < 7; j++) for (let i = 0; i < 12; i++) {
        const x = 8 + i * 6 + (j > 3 ? (j - 3) * (i < 5 ? 1.2 : .2) : 0), y = 6 + j * 6.2 - (i > 4 && i < 9 ? 1.2 : 0), a = j > 3 && i < 5 ? .25 : 0, l = j > 3 && i < 5 ? 1.2 : 1.7;
        b += `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${(a * 57).toFixed(0)})"><path d="M${-l} 0H${l}M0 ${-l}V${l}" stroke="#1a1a1a" stroke-width=".6"/></g>`;
      }
      return svg('#e6e6e6', b);
    case 'cyano':
      for (let j = 0; j < 26; j++) for (let i = 0; i < 21; i++) {
        const x = i * 4 + (j & 1) * 2, y = j * 2, v = Math.sin(x * .11 + Math.sin(y * .2) * 1.6) + Math.cos(y * .17 - x * .05) * .9;
        if (v > .1) b += `<circle cx="${x}" cy="${y}" r="${Math.min(1.5, .7 + v * .7).toFixed(2)}"/>`;
      }
      return svg('#3557b0', `<g fill="#eef2ff">${b}</g>`);
    case 'wax': {
      // a corner of the shell: big white squares in a close grid, with a swoop of the cursor's trail shrunk to diamonds
      for (let j = 0; j < 16; j++) for (let i = 0; i < 25; i++) {
        const x = 1.6 + i * 3.2, y = 1.6 + j * 3.2, d = y - 25 - 11 * Math.sin(x * .07 - 1.2);
        const v = (.76 + .08 * Math.sin(x * .12 + .4) * Math.cos(y * .15 - .2)) * (1 - .95 * Math.exp(-d * d / 16)), s = 3.2 * (.12 + .94 * v);
        b += `<rect x="${(x - s / 2).toFixed(2)}" y="${(y - s / 2).toFixed(2)}" width="${s.toFixed(2)}" height="${s.toFixed(2)}" transform="rotate(${(45 * (1 - v / .86)).toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})"/>`;
      }
      return svg('#181818', `<g fill="#f4f4f0">${b}</g>`);
    }
    case 'thock': {
      // the perforated sheet: a swipe of the laser lights a ragged band of holes glowing white on grey that shades to
      // steel blue at the bottom; the newest ones at its end still burn with orange rims
      let hot = '';
      for (let j = 0; j < 7; j++) for (let i = 0; i < 11; i++) {
        const x = (4 + i * 7.4).toFixed(1), y = (4 + j * 7.4).toFixed(1), sw = Math.abs(j - 5.6 + i * .45);
        if (!(i > 0 && sw < 1 + r() * .7)) continue;
        b += `<circle cx="${x}" cy="${y}" r="2.9"/>`;
        if (i > 8) hot += `<circle cx="${x}" cy="${y}" r="2.9"/>`;
      }
      return svg('#d3d5d7', `<defs><linearGradient id="laserShade" x1="0" y1="0" x2="0" y2="1"><stop offset=".45" stop-color="#546577" stop-opacity="0"/><stop offset=".75" stop-color="#546577" stop-opacity=".32"/><stop offset="1" stop-color="#546577" stop-opacity=".75"/></linearGradient><filter id="laserGlow" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation=".8"/></filter></defs><rect width="80" height="50" fill="url(#laserShade)"/><g fill="#fff"><g filter="url(#laserGlow)" opacity=".7">${b}</g>${b}</g><g fill="none" stroke="#ff7a2a" stroke-width=".8" filter="url(#laserGlow)">${hot}</g>`);
    }
    case 'gummy': {
      // fruit gummies packed so tight they press flat against each other: the middle one is pulled to the right, so it
      // squeezes its neighbour narrow and draws a chewy neck of jelly out of the one on its left
      const cols = ['#e8344e', '#f7801e', '#f4c21a', '#5fb83a', '#8a46cc'];
      let dust = '', gloss = '';
      const box = (x, y, w, h, c) => {
        const gx = (x - w * .18).toFixed(1), gy = (y - h * .27).toFixed(1);
        b += `<rect x="${(x - w / 2).toFixed(1)}" y="${(y - h / 2).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="3.6" fill="${c}"/>`;
        gloss += `<ellipse cx="${gx}" cy="${gy}" rx="${(w * .19).toFixed(1)}" ry="1.1" transform="rotate(-22 ${gx} ${gy})"/>`;
        for (let n = 0; n < 40; n++) dust += `M${(x + (r() - .5) * (w - 1.5)).toFixed(1)} ${(y + (r() - .5) * (h - 1.5)).toFixed(1)}h.8v.8h-.8z`;
      };
      for (let j = 0; j < 3; j++) for (let i = 0; i < 5; i++) {
        const c = cols[(i * 2 + j * 3) % 5], x = 7.6 + i * 16.2, y = 8.5 + j * 16.5;
        if (j === 1 && i === 2) box(43.2, y, 14.3, 16.8, c);
        else if (j === 1 && i === 3) box(57.5, y, 14.3, 18.2, c);
        else box(x, y, 16.8, 16.8, c);
      }
      b += `<path d="M31.5 20.6Q33 23 34.1 23.3V26.7Q33 27 31.5 29.4Z" fill="${cols[0]}"/><path d="M36.8 20.6Q35.2 23 34.1 23.3V26.7Q35.2 27 36.8 29.4Z" fill="${cols[2]}"/>`;
      return svg('#efe6d8', `${b}<path d="${dust}" fill="#fff" opacity=".7"/><g fill="#fff" opacity=".65">${gloss}</g><path d="M32.4 24.3H35.8" stroke="#fff" stroke-width=".5" opacity=".6"/>`);
    }
    case 'pudding':
      // the scene's reference picture: blurred green rounds and turned red squares packed on cream
      for (const [x, y, rr] of [[8.7, 18.3, 10], [28.9, 6.9, 10], [67.1, 13.6, 10], [33.6, 37.8, 9.3], [53, 34.4, 9.6]]) b += `<circle cx="${x}" cy="${y}" r="${rr}" fill="#1fa204"/>`;
      for (const [x, y, a] of [[60.4, .2, 20], [40.9, 21.6, -35], [15.8, 35.7, 24], [68.4, 29.7, -28]]) b += `<rect x="-7.7" y="-7.7" width="15.4" height="15.4" rx="2.9" fill="#f31802" transform="translate(${x} ${y}) rotate(${a})"/>`;
      return svg('#eed9b1', `<filter id="jellyBlur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.3"/></filter><g filter="url(#jellyBlur)">${b}</g>`);
    case 'soap': {
      // sky blue beads piled in wavy bands on white soap with a blue haze around them, a carved diagonal groove of clean
      // soap, and beads tumbling off its end. Each bead is a darker disc with a lighter one nudged up and to the left
      let haze = '', dark = '', lite = '';
      const bead = (x, y) => { dark += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="1.1"/>`; lite += `<circle cx="${(x - .22).toFixed(1)}" cy="${(y - .26).toFixed(1)}" r=".72"/>`; };
      for (let k = 0; k < 5; k++) { haze += 'M'; for (let y = -4; y <= 54; y += 4) haze += `${(22 * (k - .25 * Math.sin(y * .11 + 1.3))).toFixed(1)} ${y} `; }
      for (let n = 0; n < 3600; n++) {
        const x = r() * 84 - 2, y = r() * 54 - 2, d = .5 + .5 * Math.cos((x / 22 + .25 * Math.sin(y * .11 + 1.3)) * 6.283);
        if (r() < .03 + .97 * d * d && !(x > 5 && x < 68 && Math.abs(y - 40 + x * .42) < 3)) bead(x, y);
      }
      for (let i = 0; i < 10; i++) bead(68 + r() * 10, 10 + r() * 34);
      return svg('#f2f7fc', `<filter id="soapHaze" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.6"/></filter>` +
        `<path d="${haze}" fill="none" stroke="#c4dbf2" stroke-width="10" filter="url(#soapHaze)"/>` +
        `<path d="M5 37.9L68 11.4" stroke="#c4d9f1" stroke-width="5.4" stroke-linecap="round"/><path d="M5.4 38.4L68.4 11.9" stroke="#fbfdff" stroke-width="4.8" stroke-linecap="round"/>` +
        `<g fill="#7fb1e4">${dark}</g><g fill="#a8ccf0">${lite}</g>`);
    }
    case 'snow':
      // a trail of boot prints, left and right along a gentle curve
      for (let i = 0; i < 8; i++) {
        const x = 8 + i * 9.4, y = 27 - Math.sin(i * .62) * 8, a = Math.atan2(-Math.cos(i * .62) * 4.96, 9.4), sd = i & 1 ? 3 : -3;
        b += `<g transform="translate(${(x - Math.sin(a) * sd).toFixed(1)} ${(y + Math.cos(a) * sd).toFixed(1)}) rotate(${(a * 57.3).toFixed(0)})"><ellipse cx="1.4" rx="2.8" ry="1.4"/><ellipse cx="-2.7" rx="1.4" ry="1.15"/></g>`;
      }
      return svg('#f6f8fd', `<g fill="#b9c8f4">${b}</g>`);
    case 'sugar': {
      // three furrows raked through the grains, lit from the top left like the scene: cobalt on the shaded walls,
      // white crystals on the lit ones and a sparse speckle of both on the flat slime
      const hf = (x, y) => {
        let hi = 0, lo = 0;
        for (let f = -1; f <= 1; f++) {
          const a = Math.abs(y - 25 - f * 8 - Math.sin(x * .06 + .4) * 6) / 2.6, q = (a - 1.55) / .75;
          if (a < 1) lo = Math.min(lo, -.9 * (1 - a * a) ** 2);
          if (q > -1 && q < 1) hi = Math.max(hi, .4 * (1 - q * q) ** 2);
        }
        return lo || hi;
      };
      const d = ['', '', ''];   // cobalt, soft blue and white grains
      for (let y = .2; y < 50; y += 1.25) for (let x = .2; x < 80; x += 1.25) {
        const lit = .7 * 2.6 * (hf(x + .6, y) - hf(x - .6, y) + hf(x, y + .6) - hf(x, y - .6)) / 1.2, v = .07 - .6 * lit + .3 * Math.max(0, -hf(x, y) / .9), t = r();
        const g = `M${x.toFixed(2)} ${y.toFixed(2)}h1v1h-1z`;
        if (t < v) d[t < v * .45 ? 0 : 1] += g; else if (t > .975 - .8 * lit) d[2] += g;
      }
      return svg('#becdf9', `<path d="${d[1]}" fill="#8fa6ee"/><path d="${d[0]}" fill="${C.cobalt}"/><path d="${d[2]}" fill="#fff"/>`);
    }
  }

}

/* ---------- UI ---------- */
const ICON_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const ICON_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 5 6M21 9l-5 6"/></svg>';
const num = id => String(SOUND_IDS.indexOf(id) + 1).padStart(2, '0');
function pressedAttr(el, on) { el.setAttribute('aria-pressed', on ? 'true' : 'false'); }
function buildOptions(host, items, onPick, render) {
  host.innerHTML = '';
  Object.entries(items).forEach(([id, it]) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'opt'; b.dataset.id = id;
    b.innerHTML = render(id, it);
    b.addEventListener('click', () => onPick(id));
    host.appendChild(b);
  });
}
function syncOptions(host, cur) { host.querySelectorAll('[data-id]').forEach(b => pressedAttr(b, b.dataset.id === cur)); }

function renderAll() {
  setScene();
  $('soundNum').textContent = num(S.sound);
  $('soundName').textContent = SOUNDS[S.sound].name;
  syncOptions($('soundGrid'), S.sound);
  $('mute').innerHTML = S.muted ? ICON_OFF : ICON_ON;
  $('mute').setAttribute('aria-label', S.muted ? 'Unmute' : 'Mute');
  $('volume').value = S.volume;
  renderCount();
  requestAnimationFrame(() => { curCache = curColor(); });
}
function set(patch) {
  Object.assign(S, patch); save();
  if ('volume' in patch || 'muted' in patch) { if (A.master) A.master.gain.setTargetAtTime(S.muted ? 0 : S.volume, A.ctx.currentTime, 0.02); }
  if ('mode' in patch || 'sound' in patch) releaseAll('p');
  renderAll();
}

buildOptions($('soundGrid'), SOUNDS, pickSound,
  (id, s) => `<span class="thumb">${thumb(id)}</span><b><em>${num(id)}</em>${s.name}</b><span>${s.desc}</span>`);
function pickSound(id) { set({ sound: id }); demo(); }
function step(d) { const i = SOUND_IDS.indexOf(S.sound); pickSound(SOUND_IDS[(i + d + SOUND_IDS.length) % SOUND_IDS.length]); }

$('prev').addEventListener('click', () => step(-1));
$('next').addEventListener('click', () => step(1));
$('mute').addEventListener('click', () => { initAudio(); set({ muted: !S.muted }); });
$('volume').addEventListener('input', e => set({ volume: +e.target.value, muted: false }));

document.querySelectorAll('[data-panel]').forEach(b => b.addEventListener('click', () => {
  const p = $('panel-' + b.dataset.panel), open = p.hidden;
  closePanels();
  if (open) { p.hidden = false; b.setAttribute('aria-expanded', 'true'); }
}));
function closePanels() {
  document.querySelectorAll('.panel').forEach(p => p.hidden = true);
  document.querySelectorAll('[data-panel]').forEach(b => b.setAttribute('aria-expanded', 'false'));
}

/* a little preview swipe across the middle when a sound is picked */
function demo() {
  initAudio();
  const n = 6, gap = 110, my = FY + (ZT + ZB) / 2;
  for (let i = 0; i < n; i++) setTimeout(() => {
    const k = cellAt(FX + SW * (.38 + .24 * i / (n - 1)), my + Math.sin(i * 1.3) * CELL * .8);
    if (!k) return;
    press(k, 'demo'); setTimeout(() => release(k, 'demo'), 90);
  }, i * gap);
}

/* ---------- start ---------- */
let started = false;
function start() {
  if (started) return;
  started = true;
  initAudio();
  $('intro').hidden = true;
}
$('go').addEventListener('click', e => { e.stopPropagation(); start(); });
$('intro').addEventListener('pointerdown', e => { if (e.target.id !== 'go') start(); });

addEventListener('resize', () => { fxResize(); sceneResize(); });
applyCursor(); renderAll(); fxResize(); sceneResize();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { sceneResize(); });
window.__clack = { S, SOUNDS, initAudio, A, set }; // handy for debugging in the console
})();
