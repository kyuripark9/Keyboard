<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--artifact:start-->
<title>Clack</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Move your cursor and every step clicks, pops or squishes. Nine stress-relief sounds, each with its own graphic to play with.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a full-screen canvas scene sits under a slim header and a floating dock.
   Every sound has its own scene and its own palette, all drawn from one moodboard:
   cobalt, periwinkle, grey paper, warm paper and ink. */
:root {
  --cobalt: #2c62fb; --peri: #becdf9; --mid: #5c80ea; --paper: #f3eee6; --grey-paper: #e6e6e3; --ink-black: #1c1c1c;
  --bg: #f4f5f7; --ink: #1b2a6b; --ink-soft: #5a6890; --line: rgba(27,42,107,.14); --panel: rgba(255,255,255,.84);
  --acc: var(--cobalt); --cursor: var(--cobalt);
  --font-ui: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: light;
}
body[data-scene="wrap"]   { --bg: #eae8dc; --ink: #2c62fb; --ink-soft: #6f86c4; --line: rgba(44,98,251,.16); --panel: rgba(245,244,237,.88); --acc: #2c62fb; --cursor: #2c62fb; color-scheme: light; }
body[data-scene="cyano"]  { --bg: #3557b0; --ink: #f2f5ff; --ink-soft: #c3d0f5; --line: rgba(242,245,255,.25); --panel: rgba(40,70,150,.9); --acc: #f2f5ff; --cursor: #f2f5ff; color-scheme: dark; }
body[data-scene="cloth"]  { --bg: #e6e6e6; --ink: #1a1a1a; --ink-soft: #6a6a6a; --line: rgba(26,26,26,.14); --panel: rgba(244,244,244,.88); --acc: #1a1a1a; --cursor: #1a1a1a; color-scheme: light; }
body[data-scene="wax"]    { --bg: #f8f3d6; --ink: #3f5abb; --ink-soft: #7486c2; --line: rgba(74,102,198,.18); --panel: rgba(250,247,230,.9); --acc: #4a66c6; --cursor: #4a66c6; color-scheme: light; }
body[data-scene="keys"]   { --bg: #1c1c1c; --ink: #f3eee6; --ink-soft: #9d988e; --line: rgba(243,238,230,.16); --panel: rgba(38,38,38,.92); --acc: #5c80ea; --cursor: #5c80ea; color-scheme: dark; }
body[data-scene="glass"]  { --bg: #5c80ea; --ink: #ffffff; --ink-soft: #dbe3fb; --line: rgba(255,255,255,.26); --panel: rgba(74,110,222,.92); --acc: #ffffff; --cursor: #1b2a6b; color-scheme: dark; }
body[data-scene="jelly"]  { --bg: #eed9b1; --ink: #17690a; --ink-soft: #7d6b45; --line: rgba(23,105,10,.16); --panel: rgba(244,231,205,.9); --acc: #f31802; --cursor: #17690a; color-scheme: light; }
body[data-scene="soap"]   { --bg: #f3eee6; --ink: #1c1c1c; --ink-soft: #6d685f; --line: rgba(28,28,28,.13); --panel: rgba(249,246,241,.9); --acc: #1c1c1c; --cursor: #1c1c1c; color-scheme: light; }
body[data-scene="snow"]   { --bg: #f6f8fd; --ink: #2c62fb; --ink-soft: #6f86c4; --line: rgba(44,98,251,.16); --panel: rgba(246,248,253,.9); --acc: #2c62fb; --cursor: #2c62fb; color-scheme: light; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--bg);
  color: var(--ink); font-family: var(--font-ui);
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  touch-action: none; transition: background-color .4s;
}
body.custom-cursor, body.custom-cursor * { cursor: none !important; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; display: block; }

.app {
  position: relative; z-index: 1; height: 100%;
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.top, .dock-wrap { pointer-events: auto; }

/* Header */
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding-block: 16px 6px; }
.brand { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
.brand h1 { margin: 0; font: 800 28px/1 var(--font-ui); letter-spacing: -.04em; color: var(--ink); }
.brand h1 sup { font: 500 10px/1 var(--font-mono); letter-spacing: 0; vertical-align: top; margin-left: 2px; color: var(--ink-soft); }
.brand p { margin: 0; font: 500 12px/1.3 var(--font-mono); color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tally { text-align: right; line-height: 1.1; font-family: var(--font-mono); }
.tally b { display: block; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tally span { font-size: 11px; letter-spacing: .08em; color: var(--ink-soft); }
.stage { min-height: 0; min-width: 0; }

/* custom cursor + trail canvas: a ring in each picture's own --cursor color */
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
.cursor {
  position: fixed; left: 0; top: 0; z-index: 50; pointer-events: none; color: var(--cursor);
  width: 30px; height: 30px; margin: -15px 0 0 -15px;
  filter: drop-shadow(0 2px 3px rgba(0,0,0,.2)); will-change: transform; opacity: 0; transition: opacity .2s;
}
.cursor.on { opacity: 1; }
.cursor svg { width: 100%; height: 100%; display: block; transition: transform 90ms ease-out; }
.cursor.press svg { transform: scale(.78); transition-duration: 30ms; }

/* Dock */
.dock-wrap { position: relative; z-index: 20; display: flex; justify-content: center; padding-bottom: max(14px, env(safe-area-inset-bottom, 0px)); padding-top: 6px; }
.dock {
  display: flex; align-items: center; gap: 4px; padding: 6px; max-width: 100%;
  border-radius: 999px; background: var(--panel); border: 1px solid var(--line);
  backdrop-filter: blur(18px) saturate(1.3); -webkit-backdrop-filter: blur(18px) saturate(1.3);
  box-shadow: 0 10px 30px rgba(10,20,60,.14);
  overflow-x: auto; scrollbar-width: none;
}
.dock::-webkit-scrollbar { display: none; }
.seg { display: flex; background: var(--line); border-radius: 999px; padding: 3px; flex: none; }
.seg button, .dbtn {
  font: 500 13px/1 var(--font-ui); color: var(--ink); background: transparent; border: 0;
  display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; flex: none;
  padding: 9px 13px; border-radius: 999px; cursor: pointer; transition: background .15s, color .15s;
}
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.dbtn:hover, .dbtn[aria-expanded="true"] { background: var(--line); }
.dbtn em { font: 500 11px/1 var(--font-mono); font-style: normal; color: var(--ink-soft); }
.dbtn.step { padding: 9px 10px; }
.dbtn svg, .seg svg { width: 16px; height: 16px; flex: none; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
.sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; flex: none; }
.vol { display: flex; align-items: center; gap: 6px; padding-right: 8px; flex: none; }
input[type="range"] { accent-color: var(--ink); width: 92px; }

/* Panels */
.panel {
  position: absolute; bottom: calc(100% + 4px); left: 50%; transform: translateX(-50%);
  width: min(760px, calc(100vw - 32px)); max-height: min(78vh, 700px); overflow: auto;
  padding: 18px; border-radius: 22px; background: var(--panel); border: 1px solid var(--line);
  backdrop-filter: blur(22px) saturate(1.3); -webkit-backdrop-filter: blur(22px) saturate(1.3);
  box-shadow: 0 20px 50px rgba(10,20,60,.2); animation: rise .18s ease-out;
}
@keyframes rise { from { opacity: 0; transform: translate(-50%, 8px); } }
.panel h2 { margin: 0 0 12px; font: 500 11px/1 var(--font-mono); letter-spacing: .12em; color: var(--ink-soft); }
.panel h2 + * { margin-bottom: 18px; }
.panel > :last-child { margin-bottom: 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; }
#soundGrid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
#soundGrid .thumb { aspect-ratio: 2 / 1; }
@media (max-width: 640px) { #soundGrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.opt {
  text-align: left; font: inherit; color: var(--ink); cursor: pointer;
  padding: 8px; border-radius: 14px; border: 1px solid var(--line); background: transparent;
  display: flex; flex-direction: column; gap: 4px; transition: border-color .15s, background .15s;
}
.opt:hover { background: var(--line); }
.opt[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.opt b { font-size: 13px; font-weight: 600; display: flex; gap: 6px; align-items: baseline; padding: 2px 2px 0; }
.opt b em { font: 500 10px/1 var(--font-mono); font-style: normal; color: var(--ink-soft); }
.opt > span:last-child { font-size: 11px; line-height: 1.35; color: var(--ink-soft); padding: 0 2px 2px; }
.thumb { display: block; border-radius: 9px; overflow: hidden; aspect-ratio: 8 / 5; box-shadow: inset 0 0 0 1px rgba(0,0,0,.06); }
.thumb svg { width: 100%; height: 100%; display: block; }

/* Intro */
.intro {
  position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; text-align: center;
  background: color-mix(in srgb, var(--bg) 62%, transparent);
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.intro-card { max-width: 460px; display: grid; justify-items: center; gap: 14px; }
.intro h2 { position: relative; margin: 0; font: 800 clamp(72px, 16vw, 132px)/.9 var(--font-ui); letter-spacing: -.05em; color: var(--ink); }
.intro h2::before { content: "clack"; position: absolute; inset: 0; color: var(--acc); filter: blur(18px); opacity: .55; transform: translate(.06em, .06em); z-index: -1; }
.intro small { font: 500 11px/1 var(--font-mono); letter-spacing: .14em; color: var(--ink-soft); }
.intro p { margin: 0; font-size: 15px; line-height: 1.6; color: var(--ink-soft); text-wrap: balance; }
.go { margin-top: 6px; font: 600 16px/1 var(--font-ui); padding: 16px 28px; border-radius: 999px; border: 0; background: var(--ink); color: var(--bg); cursor: pointer; box-shadow: 0 10px 24px rgba(10,20,60,.22); }

@media (max-width: 720px) {
  .brand p { display: none; }
  .seg button { padding: 9px 11px; }
  input[type="range"] { width: 64px; }
  .tally b { font-size: 18px; }
  .brand h1 { font-size: 24px; }
}
@media (max-width: 520px) { .vol input, .dbtn.step { display: none; } }
@media (max-height: 520px) {
  .top { padding-block: 8px 2px; }
  .brand p { display: none; }
  .dock-wrap { padding-bottom: max(8px, env(safe-area-inset-bottom, 0px)); padding-top: 4px; }
  .dock { padding: 4px; }
  .seg button, .dbtn { padding: 7px 10px; }
}
@media (prefers-reduced-motion: reduce) { .panel { animation: none; } }
</style>
</head>
<body>
<canvas id="scene" aria-label="Interactive graphic. Move your cursor to play"></canvas>
<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <h1>clack<sup>09</sup></h1>
    </div>
    <div class="tally" aria-live="off">
      <b id="count">0</b>
      <span>CLACKS</span>
    </div>
  </header>

  <main class="stage" id="stage"></main>

  <div class="dock-wrap" id="dockWrap">
    <nav class="dock" id="dock" aria-label="Settings">
      <button class="dbtn step" id="prev" type="button" aria-label="Previous sound"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg></button>
      <button class="dbtn" type="button" data-panel="sound" aria-expanded="false">
        <em id="soundNum">01</em><span id="soundName"></span>
      </button>
      <button class="dbtn step" id="next" type="button" aria-label="Next sound"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button>
      <span class="sep"></span>
      <div class="vol">
        <button class="dbtn" id="mute" type="button" aria-label="Mute" style="padding:9px"></button>
        <input id="volume" type="range" min="0" max="1" step="0.01" aria-label="Volume">
      </div>
    </nav>

    <section class="panel" id="panel-sound" hidden aria-label="Choose a sound">
      <h2>9 SOUNDS, 9 PICTURES</h2>
      <div class="grid" id="soundGrid"></div>
    </section>
  </div>
</div>

<canvas id="fx" aria-hidden="true"></canvas>
<div class="cursor" id="cursor" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/></svg></div>

<div class="intro" id="intro">
  <div class="intro-card">
    <small>A TOY ABOUT DOING NOTHING</small>
    <h2>clack</h2>
    <p>Move your cursor and every step clicks, pops or squishes.<br>Nine sounds, nine pictures to crack, squish and crunch.</p>
    <button class="go" id="go" type="button">Turn on sound &amp; start</button>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);

/* ---------- settings ---------- */
const SOUND_IDS = ['bubble', 'slime', 'cyano', 'wax', 'thock', 'tanghulu', 'pudding', 'soap', 'snow'];
const DEF = { mode: 'hover', sound: 'bubble', volume: 0.7, muted: false, count: 0 };
let S = { ...DEF };
try { Object.assign(S, JSON.parse(localStorage.getItem('clack') || '{}')); } catch (e) {}
S.sound = DEF.sound; // every visit opens on 01 Bubble Wrap; the other settings are remembered
S.mode = 'hover'; // Tap mode was removed: sounds always play as the cursor moves (touch screens still drag)
let saveT = 0;
function save() {
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    try { const { mode, sound, volume, muted, count } = S; localStorage.setItem('clack', JSON.stringify({ mode, sound, volume, muted, count })); } catch (e) {}
  }, 300);
}

/* ---------- audio ---------- */
const A = { ctx: null };
function makeIR(C, secs, decay) {
  const len = Math.floor(C.sampleRate * secs), b = C.createBuffer(2, len, C.sampleRate);
  for (let ch = 0; ch < 2; ch++) { const d = b.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay); }
  return b;
}
function initAudio(C) {
  if (A.ctx && !C) { if (A.ctx.state === 'suspended') A.ctx.resume(); return; }
  C = C || new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
  A.ctx = C;
  A.master = C.createGain(); A.master.gain.value = S.muted ? 0 : S.volume;
  const comp = C.createDynamicsCompressor();
  comp.threshold.value = -16; comp.knee.value = 10; comp.ratio.value = 5; comp.attack.value = 0.002; comp.release.value = 0.15;
  A.dry = C.createGain(); A.dry.gain.value = 1.9; A.dry.connect(comp);
  A.wet = C.createGain(); A.wet.gain.value = 1.1;
  const verb = C.createConvolver(); verb.buffer = makeIR(C, 2.4, 3.4);
  A.wet.connect(verb); verb.connect(comp);
  // a gentle top-end roll-off keeps the tingle soft instead of sharp
  const soft = C.createBiquadFilter(); soft.type = 'lowpass'; soft.frequency.value = 10500; soft.Q.value = 0.5;
  comp.connect(soft); soft.connect(A.master); A.master.connect(C.destination);
  const n = C.createBuffer(1, C.sampleRate, C.sampleRate), d = n.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  A.noise = n;
}
function env(v, t, a, d, g) {
  v.gain.setValueAtTime(0.0001, t);
  v.gain.exponentialRampToValueAtTime(g, t + a);
  v.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
}
function out(v, wet) {
  v.connect(A.dry);
  if (wet) { const s = A.ctx.createGain(); s.gain.value = wet; v.connect(s); s.connect(A.wet); }
}
function tone(type, f, t, o = {}) {
  const { a = 0.002, d = 0.1, g = 0.5, f2 = 0, ft = 0.05, wet = 0 } = o;
  const C = A.ctx, osc = C.createOscillator(), v = C.createGain();
  osc.type = type; osc.frequency.setValueAtTime(f, t);
  if (f2) osc.frequency.exponentialRampToValueAtTime(f2, t + ft);
  env(v, t, a, d, g); osc.connect(v); out(v, wet);
  osc.start(t); osc.stop(t + a + d + 0.05);
}
function hiss(t, o = {}) {
  const { type = 'bandpass', f = 2000, q = 1, a = 0.001, d = 0.03, g = 0.5, f2 = 0, ft = 0.05, wet = 0 } = o;
  const C = A.ctx, s = C.createBufferSource(), fl = C.createBiquadFilter(), v = C.createGain();
  s.buffer = A.noise; s.playbackRate.value = 0.9 + Math.random() * 0.2;
  fl.type = type; fl.frequency.setValueAtTime(f, t); if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + ft); fl.Q.value = q;
  env(v, t, a, d, g); s.connect(fl); fl.connect(v); out(v, wet);
  s.start(t, Math.random() * 0.5); s.stop(t + a + d + 0.05);
}
// a tone whose pitch shivers with a fading vibrato, for anything that jiggles
function wobble(f, t, o = {}) {
  const { a = 0.006, d = 0.25, g = 0.5, rate = 9, depth = 0.1, f2 = 0, ft = 0.08, wet = 0 } = o;
  const C = A.ctx, osc = C.createOscillator(), lfo = C.createOscillator(), lg = C.createGain(), v = C.createGain();
  osc.frequency.setValueAtTime(f, t); if (f2) osc.frequency.exponentialRampToValueAtTime(f2, t + ft);
  lfo.frequency.value = rate; lg.gain.setValueAtTime(f * depth, t); lg.gain.exponentialRampToValueAtTime(f * depth * 0.05, t + a + d);
  lfo.connect(lg); lg.connect(osc.frequency);
  env(v, t, a, d, g); osc.connect(v); out(v, wet);
  osc.start(t); lfo.start(t); osc.stop(t + a + d + 0.05); lfo.stop(t + a + d + 0.05);
}
const rand = (a, b) => a + Math.random() * (b - a);

/* Each sound: scene = the picture it draws, desc = one line for the picker.
   All are tuned for ASMR: soft attacks, rounded filters, tiny crisp details and a little room tone.
*/
function crinkle(t, n, spread, o = {}) {
  const { lo = 2600, hi = 6000, g = 0.35, q = 2.5 } = o;
  for (let i = 0; i < n; i++) { const at = t + Math.pow(Math.random(), 1.6) * spread; hiss(at, { f: rand(lo, hi), q, a: 0.0015, d: rand(0.004, 0.012), g: rand(0.4, 1) * g * (1 - (at - t) / spread * 0.6) }); }
}
const SOUNDS = {
  bubble: { name: 'Bubble Wrap', desc: 'Pop rings of blue ink', scene: 'wrap', noTrail: true,
    // a gentle, muffled pop with a whisper of plastic crinkle after it
    down(k, t, j) {
      const f0 = (210 + k.seed * 120) * j;
      hiss(t, { type: 'lowpass', f: 1400, q: 0.7, a: 0.003, d: 0.014, g: 0.55 });
      tone('sine', f0, t, { f2: f0 * 1.6, ft: 0.06, a: 0.006, d: 0.08, g: 0.28, wet: 0.15 });
      crinkle(t + 0.015, 3, 0.1, { lo: 3000, hi: 5500, g: 0.08 });
    } },
  slime: { name: 'Crunchy Slime', desc: 'Crumple a sheet of stitches', scene: 'cloth', noTrail: true,
    // foam beads bursting inside glossy slime: a wet press and a fizz of tiny crackles
    down(k, t, j) {
      hiss(t, { f: 380 * j, f2: 700, ft: 0.1, q: 6, a: 0.025, d: 0.14, g: 1, wet: 0.08 });
      crinkle(t + 0.01, 12 + Math.floor(Math.random() * 6), 0.18, { lo: 2800, hi: 7000, g: 0.6, q: 3 });
    },
    up(k, t, j) { hiss(t, { f: 700 * j, f2: 1500, ft: 0.08, q: 8, a: 0.01, d: 0.08, g: 0.4 }); crinkle(t, 4, 0.06, { g: 0.2 }); } },
  cyano: { name: 'Cyanotype', desc: 'Expose white dots on blue', scene: 'cyano',
    // a stippling pen dotting thick paper: the soft tick of the tip, a papery dab with a little weight under it, a brush of
    // air and a fizz of fine grains; now and then a faint twinkle rings out with the glints
    down(k, t, j) {
      hiss(t, { f: 3000 * j, q: 1.4, a: 0.0008, d: 0.009, g: 1.2 });
      hiss(t, { type: 'lowpass', f: 950 * j, q: 0.8, a: 0.002, d: 0.035, g: 0.9 });
      tone('sine', (190 + k.seed * 50) * j, t, { f2: 140, ft: 0.03, a: 0.002, d: 0.035, g: 0.2 });
      hiss(t + 0.006, { f: 3400 * j, f2: 1900, ft: 0.06, q: 0.9, a: 0.008, d: 0.06, g: 0.28, wet: 0.05 });
      crinkle(t + 0.008, 6 + Math.floor(Math.random() * 4), 0.07, { lo: 3200, hi: 7200, g: 0.32, q: 2.5 });
      if (Math.random() < 0.3) tone('sine', [2349, 2637, 3136, 3520, 3951][Math.floor(Math.random() * 5)], t + 0.02, { a: 0.008, d: 0.24, g: 0.03, wet: 0.5 });
    } },

addEventListener('pointerdown', e => {

/* ---------- drawing helpers ---------- */

/* ---------- scenes: init() paints the static deco layer, hit() reacts to a step, draw() runs every frame ---------- */
const SCENES = {
  /* 01 Bubble Wrap: the sheet drawn as a contour map in blue ink on cream paper. Every bubble is a hill of rings,
     the sheet sways gently, and a pop flattens its hill and sends a ripple through the neighbours' rings. */
  wrap: {
    frame: 'full',
    init() {
      const G = this.G = 2, w = this.w = Math.ceil(SW / G), h = this.h = Math.ceil(SH / G);
      this.off = this.off || document.createElement('canvas'); this.off.width = w; this.off.height = h;
      this.oc = this.off.getContext('2d'); this.img = this.oc.createImageData(w, h); this.px = new Uint32Array(this.img.data.buffer);
      this.F = new Float32Array(w * h);

      // bubbles sit on a square lattice; each keeps its own height so the inner rings vary from bubble to bubble

      this.amp = new Float32Array(this.cols * this.rows); this.base = new Float32Array(this.amp.length); this.back = new Float64Array(this.amp.length);
      for (let i = 0; i < this.amp.length; i++) this.amp[i] = this.base[i] = rand(.8, 1);
      this.x0 = (SW % s2) / 2; this.y0 = ((ZT + ZB) / 2) % s2;
      this.cosT = Float32Array.from({ length: 1024 }, (_, i) => .5 + .5 * Math.cos(i / 1024 * 6.2832));
      this.rip = []; this.cur = { x: -999, y: -999, a: 0, t: 0 };
      this.M = new Float32Array(w * h); this.mk = ''; this.mt = 0;
      paper(dc, '#eae8dc', .07);
    },
    // the sheet flattens around the logo, the tally and the dock, so the rings close into rounded ends and part
    // around them instead of running under the text. Rebuilt whenever one of them moves or grows (the tally gains digits)
    ui() {
      const rs = [...document.querySelectorAll('.brand, .tally, #dock')].map(e => e.getBoundingClientRect()).filter(r => r.width);
      const key = rs.map(r => [r.left, r.top, r.right, r.bottom].map(Math.round).join()).join('|');
      if (key === this.mk) return;
      this.mk = key;
      const G = this.G, w = this.w, h = this.h, M = this.M, pad = 8, ramp = this.s * 1.1;

        const rr = Math.min(r.width, r.height) / 2, l = r.left - FX + rr, t = r.top - FY + rr, R = r.right - FX - rr, B = r.bottom - FY - rr, reach = rr + pad + ramp;
        const i0 = Math.max(0, Math.floor((l - reach) / G)), i1 = Math.min(w - 1, Math.ceil((R + reach) / G)), j0 = Math.max(0, Math.floor((t - reach) / G)), j1 = Math.min(h - 1, Math.ceil((B + reach) / G));
        for (let j = j0; j <= j1; j++) for (let i = i0, o = j * w + i0; i <= i1; i++, o++) {

    draw(now, dt) {

      const G = this.G, w = this.w, h = this.h, F = this.F, s2 = this.s, cols = this.cols, amp = this.amp, cosT = this.cosT;

  /* 04 Wax Ball: the 왁뿌볼's wax shell drawn like a line-screen print: rows of rounded cobalt dashes on butter-cream

     the floors of a building. Every step cracks the blocks around it, nearest first: they split apart and slide

     squeezes it up between them, and the wax slowly sets back into place. */
  wax: {
    frame: 'feather',
    init() {

            c: 0, amt: 0, at: 0, end: 0, dx: 0, dy: 0, tone: 0, ox: 0, oy: 0, m: 0, k: 2 };

  /* 05 Thocky Keys: a cream keyboard on an ink-black desk. Every step bottoms out the key under it: the cap sinks with a

        [['fn', 1.25], ['opt', 1.25], [' ', 5], ['opt', 1.25], ['ctrl', 1.25]],

  /* 06 Tanghulu: a sheet of glossy candy glass, like the sugar shell on a skewer of fruit. Every step bites a crack into
     it: a star of straight, kinked fractures snaps out from the bite and runs back to the last one, so a swipe leaves
     one connected crack; the bite crushes to white frost, chips of sugar flick out and fall, a soft highlight slides
     over the gloss with the cursor, and the cracks melt away. */
  glass: {
    frame: 'feather',
    init() {
      paper(dc, '#5c80ea', .06);
      // gloss: soft diagonal bands of light across the sheet
      for (const [cx, w, al] of [[.2, .18, .3], [.31, .04, .45], [.68, .24, .16], [.8, .03, .3]]) {
        dc.save(); dc.translate(SW * cx, SH / 2); dc.rotate(-.55);
        const b = dc.createLinearGradient(-SW * w / 2, 0, SW * w / 2, 0);
        b.addColorStop(0, 'rgba(255,255,255,0)'); b.addColorStop(.5, `rgba(255,255,255,${al})`); b.addColorStop(1, 'rgba(255,255,255,0)');
        dc.fillStyle = b; dc.fillRect(-SW * w / 2, -SH * 2, SW * w, SH * 4); dc.restore();
      }

    },
    move(x, y) { this.cur = { x, y, t: performance.now() }; },
    hit(x, y, k, now) {

      // now and then along it, and between those just a couple of short side branches off the running crack
      const L = this.last, d = L ? Math.hypot(L.x - x, L.y - y) : 0, star = !L || now - L.t > 300 || Math.random() < .2;
      const R = star ? rand(36, 70) : rand(14, 32), n = star ? 5 + Math.floor(Math.random() * 3) : 2 + Math.floor(Math.random() * 2), a0 = rand(0, 6.283), rays = [], rings = [];
      const ray = (a, len) => {

        return pts;

      for (let i = 0; i < n; i++) rays.push(ray(a0 + i / n * 6.283 + rand(-.25, .25), R * rand(.45, 1)));

      const on = (ray, r) => { for (let i = 1; i < ray.length; i++) if (ray[i][2] >= r) { const p = ray[i - 1], q = ray[i], t = (r - p[2]) / (q[2] - p[2]); return [lerp(p[0], q[0], t), lerp(p[1], q[1], t)]; } return null; };
      if (star) for (let i = 0; i < n; i++) {

        if (A && B && Math.random() < .7) rings.push({ r, A, B, m: [(A[0] + B[0]) / 2 + rand(-2, 2), (A[1] + B[1]) / 2 + rand(-2, 2)] });

    },
    draw(now, dt) {

      if (act > .01) {

        g.addColorStop(0, `rgba(255,255,255,${.3 * act})`); g.addColorStop(1, 'rgba(255,255,255,0)');

  /* 07 Pudding: a soft-focus field of green jelly rounds and red jelly squares on cream, every edge blurred as if seen
     through frosted glass. Every step taps the jelly under it: it spreads flat, springs back and jiggles out of shape,
     and the wobble ripples out through its neighbours a beat later, weaker the farther they sit. The jelly under a
     resting cursor stays pressed in a little. */
  jelly: {
    frame: 'full',
    init() {
      const s = this.s = clamp(Math.round(Math.min(SW, ZB - ZT) / 4.4), 60, 170), p = s * 1.04, ph = p * .88, bl = s * .067;
      // each shape is blurred once into a sprite here, and only stretched and turned every frame
      const sprite = (fill, path) => {
        const c = document.createElement('canvas'), n = Math.ceil((s + bl * 6) * SDPR), x = c.getContext('2d');
        c.width = c.height = n;

        return c;

      round.arc(0, 0, s / 2, 0, 6.283); roundPoly(box, [[-h, -h], [h, -h], [h, h], [-h, h]], s * .15);

        const row = [];
        for (let i = 0; i < cols - (j & 1); i++) {
          // squares and rounds mostly alternate: the more squares already sit beside and above, the likelier a round
          const reds = [row[i - 1], ...(j & 1 ? [prev[i], prev[i + 1]] : [prev[i - 1], prev[i]])].filter(v => v === 1).length;
          const k = Math.random() < [.8, .5, .2, .05][reds] ? 1 : 0;
          row.push(k);
          this.p.push({ x: x0 + (i + (j & 1) * .5) * p + rand(-.1, .1) * p, y: y0 + j * ph + rand(-.1, .1) * p, k, r: k ? rand(-.7, .7) : 0, g: rand(.96, 1.04),
            sq: 0, sv: 0, ex: 0, evx: 0, ey: 0, evy: 0 });
        }

      }

    },
    move(x, y, dx, dy) { const l = Math.hypot(dx, dy); if (l > .5) this.dir = [dx / l, dy / l]; this.cur = { x, y, t: performance.now() }; },
    hit(x, y, k, now) {

      // weaker, stretched along the line from the step
      const s = this.s, R = s * 2.4;
      for (const P of this.p) {
        const dx = P.x - x, dy = P.y - y, d = Math.hypot(dx, dy);
        if (d > R) continue;

        this.q.push({ P, t: now + (own ? 0 : d * 1.6), a: own ? 1 : .5 * (1 - d / R), c: Math.cos(2 * a), s: Math.sin(2 * a) });
      }

    },
    draw(now, dt) {
      sc.drawImage(deco, 0, 0, SW, SH);
      this.q = this.q.filter(e => { if (now < e.t) return true; e.P.sv += .022 * e.a; e.P.evx += .016 * e.a * e.c; e.P.evy += .016 * e.a * e.s; return false; });

  /* 08 Soap Cutting: a cream bar of soap with a periwinkle core, scored into tiny cubes. Every step shaves a short strip
     along the way the cursor travels: its cubes come loose, tumble off and fall out of the frame, the core shows in
     the cut, and the bar slowly sets smooth again. */
  soap: {
    init() {
      const c = this.c = clamp(Math.round(Math.min(SW, SH) / 36), 9, 15);
      this.cols = Math.ceil(SW / c); this.rows = Math.ceil(SH / c);
      this.cut = new Float64Array(this.cols * this.rows); this.back = new Float64Array(this.cut.length);
      paper(dc, '#f3eee6', .06);

      for (let i = 1; i < this.cols; i++) { dc.moveTo(i * c + .5, 0); dc.lineTo(i * c + .5, SH); }
      for (let j = 1; j < this.rows; j++) { dc.moveTo(0, j * c + .5); dc.lineTo(SW, j * c + .5); }
      dc.stroke();

    },
    move(x, y, dx, dy) { const l = Math.hypot(dx, dy); if (l > .5) this.dir = [dx / l, dy / l]; },
    hit(x, y, k, now) {
      // the blade takes an oval strip, long along the stroke so consecutive steps join into one carved line
      const c = this.c, [ux, uy] = this.dir, ra = Math.max(CELL * .75, c * 2), rb = c * rand(1.2, 1.9), R = Math.max(ra, rb);
      const i0 = Math.max(0, Math.floor((x - R) / c)), i1 = Math.min(this.cols - 1, Math.floor((x + R) / c));
      const j0 = Math.max(0, Math.floor((y - R) / c)), j1 = Math.min(this.rows - 1, Math.floor((y + R) / c));
      for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {

        if (a * a + b * b > 1 || (this.cut[q] && now < this.back[q])) continue;
        this.cut[q] = now; this.back[q] = now + rand(8000, 12000);
        this.bits.push({ x: (i + .5) * c, y: (j + .5) * c, vx: ux * rand(.03, .12) + rand(-.03, .03), vy: uy * rand(.03, .1) - rand(.04, .14), a: 0, va: rand(-.012, .012) });
      }
      if (this.bits.length > 700) this.bits.splice(0, this.bits.length - 700);
    },
    draw(now, dt) {
      sc.drawImage(deco, 0, 0, SW, SH);
      const c = this.c, cols = this.cols, cut = this.cut, hole = [0, 1, 2, 3].map(() => new Path2D()), lip = [0, 1, 2, 3].map(() => new Path2D());
      for (let q = 0; q < cut.length; q++) {

        const al = clamp((this.back[q] + 2500 - now) / 2500, 0, 1);
        if (!al) { cut[q] = 0; continue; }
        const i = q % cols, j = (q - i) / cols, b = Math.min(3, Math.floor(al * 4)), x = i * c, y = j * c;
        hole[b].rect(x + 1, y + 1, c - 1, c - 1);
        // the uncut wall above and to the left throws a shadow into the cut

        if (i && !cut[q - 1]) lip[b].rect(x, y, c * .22, c);

      sc.globalAlpha = 1;

  /* 09 Snow: a field of fresh snow. Every step crunches a boot print into it, left and right in turn along the way the
     cursor walks, each with a blue shadow pressed inside it and a rim of kicked-up crumbs; glitter twinkles across the
     field and around the cursor, and new snow slowly fills the prints back in. */
  snow: {
    init() {
      paper(dc, '#f6f8fd', .04);
      // wind-packed drifts: wavy crests with a faint blue shadow falling away below each
      for (let i = 0; i < 5; i++) {
        const y = SH * (i + rand(.3, .7)) / 5, ph = rand(0, 6.283), g = dc.createLinearGradient(0, y - 24, 0, y + 60);
        g.addColorStop(0, 'rgba(190,205,249,.34)'); g.addColorStop(1, 'rgba(190,205,249,0)');
        dc.fillStyle = g; dc.beginPath(); dc.moveTo(0, y + 60);
        for (let x = 0; x <= SW + 20; x += 20) dc.lineTo(x, y - 10 + 14 * Math.sin(x / 190 + ph) + 5 * Math.sin(x / 67 + ph * 2));
        dc.lineTo(SW + 20, y + 60); dc.closePath(); dc.fill();
      }
      this.pr = []; this.gl = []; this.foot = 1; this.dir = [1, 0];
      // one boot sole, toe pointing along +x: the ball of the foot, a narrow waist and the heel
      const L = this.L = clamp(CELL * 1.3, 30, 54), sole = this.sole = new Path2D();
      sole.moveTo(L * .48, 0); sole.ellipse(L * .18, 0, L * .3, L * .16, 0, 0, 6.283);
      sole.moveTo(L * .12, 0); sole.ellipse(-L * .08, 0, L * .2, L * .1, 0, 0, 6.283);
      sole.moveTo(-L * .16, 0); sole.ellipse(-L * .32, 0, L * .16, L * .13, 0, 0, 6.283);
    },
    move(x, y, dx, dy) {
      const l = Math.hypot(dx, dy); if (l > .5) this.dir = [dx / l, dy / l];
      if (Math.random() < .35) this.glint(x + rand(-60, 60), y + rand(-60, 60), performance.now());
    },
    glint(x, y, now) { this.gl.push({ x, y, t0: now, life: rand(300, 700), r: rand(2, 4.5) }); if (this.gl.length > 70) this.gl.shift(); },
    hit(x, y, k, now) {
      // a print every stride, feet taking turns either side of the path, each pointing the way the cursor walks
      const L = this.L, last = this.pr[this.pr.length - 1];
