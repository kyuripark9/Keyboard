<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--artifact:start-->
<title>Clack</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Move your cursor and every step clicks, pops or squishes. Ten stress-relief sounds, each with its own graphic to play with.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a full-screen canvas scene sits under a slim header and a floating dock.
   Every sound has its own scene and its own palette, all drawn from one moodboard:
   cobalt, periwinkle, grey paper, warm paper and ink. */
:root {
  --cobalt: #2c62fb; --peri: #becdf9; --mid: #5c80ea; --paper: #f3eee6; --grey-paper: #e6e6e3; --ink-black: #1c1c1c;
  --bg: #f4f5f7; --ink: #1b2a6b; --ink-soft: #5a6890; --line: rgba(27,42,107,.14); --panel: rgba(255,255,255,.84);
  --acc: var(--cobalt); --cursor: var(--cobalt);
  --font-ui: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: light;
}
body[data-scene="goo"]   { --bg: #ffffff; --ink: #111111; --ink-soft: #5a5a5a; --line: rgba(17,17,17,.14); --panel: rgba(255,255,255,.88); --acc: #111111; --cursor: #111111; color-scheme: light; }
body[data-scene="spin"]   { --bg: #f1f0ec; --ink: #111111; --ink-soft: #6a6a66; --line: rgba(17,17,17,.13); --panel: rgba(250,250,247,.88); --acc: #111111; --cursor: #111111; color-scheme: light; }
body[data-scene="wrap"]   { --bg: #e6e6e3; --ink: #1c1c1c; --ink-soft: #616d78; --line: rgba(28,28,28,.14); --panel: rgba(244,244,241,.88); --acc: #2c62fb; --cursor: #1c1c1c; color-scheme: light; }
body[data-scene="blob"]   { --bg: #f2f3f6; --ink: #1b2a6b; --ink-soft: #5a6890; --line: rgba(27,42,107,.13); --panel: rgba(255,255,255,.82); --acc: #2c62fb; --cursor: #2c62fb; color-scheme: light; }
body[data-scene="cloth"]  { --bg: #e6e6e6; --ink: #1a1a1a; --ink-soft: #6a6a6a; --line: rgba(26,26,26,.14); --panel: rgba(244,244,244,.88); --acc: #1a1a1a; --cursor: #1a1a1a; color-scheme: light; }
body[data-scene="sand"]   { --bg: #fbfaf7; --ink: #111111; --ink-soft: #6a6a66; --line: rgba(17,17,17,.13); --panel: rgba(255,255,255,.88); --acc: #111111; --cursor: #111111; color-scheme: light; }
body[data-scene="type"]   { --bg: #f3eee6; --ink: #1c1a17; --ink-soft: #6a6352; --line: rgba(28,26,23,.14); --panel: rgba(248,244,236,.9); --acc: #1c1a17; --cursor: #1c1a17; color-scheme: light; }
body[data-scene="bars"]   { --bg: #161616; --ink: #f1f1ef; --ink-soft: #9a9fa6; --line: rgba(241,241,239,.16); --panel: rgba(30,30,30,.88); --acc: #becdf9; --cursor: #becdf9; color-scheme: dark; }
body[data-scene="blur"]   { --bg: #f6f7f9; --ink: #1b2a6b; --ink-soft: #5a6890; --line: rgba(27,42,107,.14); --panel: rgba(255,255,255,.86); --acc: #2c62fb; --cursor: #2c62fb; color-scheme: light; }
body[data-scene="ripple"] { --bg: #becdf9; --ink: #0f2a8a; --ink-soft: #3a55a8; --line: rgba(15,42,138,.18); --panel: rgba(222,230,252,.86); --acc: #2c62fb; --cursor: #2c62fb; color-scheme: light; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--bg);
  color: var(--ink); font-family: var(--font-ui);
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  touch-action: none; transition: background-color .4s;
}
body.custom-cursor, body.custom-cursor * { cursor: none !important; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; display: block; }
/* Wax Ball draws black outlines here; blur + contrast melts every near-touching line into gooey webbing */
#goo { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; display: none; background: #fff; filter: blur(4px) contrast(30); }
body[data-scene="goo"] #goo { display: block; }
body[data-scene="goo"] .top { text-shadow: 0 0 3px #fff, 0 0 6px #fff, 0 0 10px #fff; }

.app {
  position: relative; z-index: 1; height: 100%;
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.top, .dock-wrap { pointer-events: auto; }

/* Header */
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding-block: 16px 6px; }
.brand { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
.brand h1 { margin: 0; font: 800 28px/1 var(--font-ui); letter-spacing: -.04em; color: var(--ink); }
.brand h1 sup { font: 500 10px/1 var(--font-mono); letter-spacing: 0; vertical-align: top; margin-left: 2px; color: var(--ink-soft); }
.brand p { margin: 0; font: 500 12px/1.3 var(--font-mono); color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tally { text-align: right; line-height: 1.1; font-family: var(--font-mono); }
.tally b { display: block; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tally span { font-size: 11px; letter-spacing: .08em; color: var(--ink-soft); }
.stage { min-height: 0; min-width: 0; }

/* custom cursor + trail canvas */
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
.cursor {
  position: fixed; left: 0; top: 0; z-index: 50; pointer-events: none; color: var(--cursor);
  width: var(--cs, 28px); height: var(--cs, 28px); margin: calc(var(--cs, 28px) / -2) 0 0 calc(var(--cs, 28px) / -2);
  filter: drop-shadow(0 2px 3px rgba(0,0,0,.2)); will-change: transform; opacity: 0; transition: opacity .2s;
}
.cursor.on { opacity: 1; }
.cursor.tl { margin: -2px 0 0 -3px; }
.cursor svg { width: 100%; height: 100%; display: block; transition: transform 90ms ease-out; }
.cursor.press svg { transform: scale(.78); transition-duration: 30ms; }

/* Dock */
.dock-wrap { position: relative; z-index: 20; display: flex; justify-content: center; padding-bottom: max(14px, env(safe-area-inset-bottom, 0px)); padding-top: 6px; }
.dock {
  display: flex; align-items: center; gap: 4px; padding: 6px; max-width: 100%;
  border-radius: 999px; background: var(--panel); border: 1px solid var(--line);
  backdrop-filter: blur(18px) saturate(1.3); -webkit-backdrop-filter: blur(18px) saturate(1.3);
  box-shadow: 0 10px 30px rgba(10,20,60,.14);
  overflow-x: auto; scrollbar-width: none;
}
.dock::-webkit-scrollbar { display: none; }
.seg { display: flex; background: var(--line); border-radius: 999px; padding: 3px; flex: none; }
.seg button, .dbtn {
  font: 500 13px/1 var(--font-ui); color: var(--ink); background: transparent; border: 0;
  display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; flex: none;
  padding: 9px 13px; border-radius: 999px; cursor: pointer; transition: background .15s, color .15s;
}
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.dbtn:hover, .dbtn[aria-expanded="true"] { background: var(--line); }
.dbtn em { font: 500 11px/1 var(--font-mono); font-style: normal; color: var(--ink-soft); }
.dbtn.step { padding: 9px 10px; }
.dbtn svg, .seg svg { width: 16px; height: 16px; flex: none; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
.sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; flex: none; }
.vol { display: flex; align-items: center; gap: 6px; padding-right: 8px; flex: none; }
input[type="range"] { accent-color: var(--ink); width: 92px; }

/* Panels */
.panel {
  position: absolute; bottom: calc(100% + 4px); left: 50%; transform: translateX(-50%);
  width: min(760px, calc(100vw - 32px)); max-height: min(66vh, 600px); overflow: auto;
  padding: 18px; border-radius: 22px; background: var(--panel); border: 1px solid var(--line);
  backdrop-filter: blur(22px) saturate(1.3); -webkit-backdrop-filter: blur(22px) saturate(1.3);
  box-shadow: 0 20px 50px rgba(10,20,60,.2); animation: rise .18s ease-out;
}
@keyframes rise { from { opacity: 0; transform: translate(-50%, 8px); } }
.panel h2 { margin: 0 0 12px; font: 500 11px/1 var(--font-mono); letter-spacing: .12em; color: var(--ink-soft); }
.panel h2 + * { margin-bottom: 18px; }
.panel > :last-child { margin-bottom: 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; }
#soundGrid { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 640px) { #soundGrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.opt {
  text-align: left; font: inherit; color: var(--ink); cursor: pointer;
  padding: 8px; border-radius: 14px; border: 1px solid var(--line); background: transparent;
  display: flex; flex-direction: column; gap: 4px; transition: border-color .15s, background .15s;
}
.opt:hover { background: var(--line); }
.opt[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.opt b { font-size: 13px; font-weight: 600; display: flex; gap: 6px; align-items: baseline; padding: 2px 2px 0; }
.opt b em { font: 500 10px/1 var(--font-mono); font-style: normal; color: var(--ink-soft); }
.opt > span:last-child { font-size: 11px; line-height: 1.35; color: var(--ink-soft); padding: 0 2px 2px; }
.thumb { display: block; border-radius: 9px; overflow: hidden; aspect-ratio: 8 / 5; box-shadow: inset 0 0 0 1px rgba(0,0,0,.06); }
.thumb svg { width: 100%; height: 100%; display: block; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.sw { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--panel); cursor: pointer; padding: 0; box-shadow: 0 0 0 1px var(--line); }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
.sw.auto { background: conic-gradient(#2c62fb, #becdf9, #f3eee6, #1c1c1c, #2c62fb); }
.sw.pick { position: relative; overflow: hidden; background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red); }
.sw.pick input { position: absolute; inset: -6px; width: 200%; height: 200%; opacity: 0; cursor: pointer; }
.chip { font: 500 13px/1 var(--font-ui); color: var(--ink); padding: 9px 13px; border-radius: 999px; border: 1px solid var(--line); background: transparent; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.cur-opt { align-items: center; text-align: center; padding: 11px 8px; }
.cur-opt svg { width: 26px; height: 26px; color: var(--ink); }
.cur-opt span { font-size: 12px; color: var(--ink-soft); }
.row-line { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--ink-soft); }

/* Intro */
.intro {
  position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; text-align: center;
  background: color-mix(in srgb, var(--bg) 62%, transparent);
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.intro-card { max-width: 460px; display: grid; justify-items: center; gap: 14px; }
.intro h2 { position: relative; margin: 0; font: 800 clamp(72px, 16vw, 132px)/.9 var(--font-ui); letter-spacing: -.05em; color: var(--ink); }
.intro h2::before { content: "clack"; position: absolute; inset: 0; color: var(--acc); filter: blur(18px); opacity: .55; transform: translate(.06em, .06em); z-index: -1; }
.intro small { font: 500 11px/1 var(--font-mono); letter-spacing: .14em; color: var(--ink-soft); }
.intro p { margin: 0; font-size: 15px; line-height: 1.6; color: var(--ink-soft); text-wrap: balance; }
.go { margin-top: 6px; font: 600 16px/1 var(--font-ui); padding: 16px 28px; border-radius: 999px; border: 0; background: var(--ink); color: var(--bg); cursor: pointer; box-shadow: 0 10px 24px rgba(10,20,60,.22); }
.toast {
  position: fixed; left: 50%; top: max(70px, calc(env(safe-area-inset-top, 0px) + 60px)); transform: translateX(-50%);
  z-index: 30; padding: 10px 16px; border-radius: 999px; background: var(--ink); color: var(--bg); font-size: 13px;
  pointer-events: none; transition: opacity .3s; opacity: 0;
}
.toast.on { opacity: 1; }

@media (max-width: 720px) {
  .dbtn .lbl, .brand p { display: none; }
  .seg button { padding: 9px 11px; }
  input[type="range"] { width: 64px; }
  .tally b { font-size: 18px; }
  .brand h1 { font-size: 24px; }
}
@media (max-width: 520px) { .vol input, .dbtn.step { display: none; } }
@media (max-height: 520px) {
  .top { padding-block: 8px 2px; }
  .brand p { display: none; }
  .dock-wrap { padding-bottom: max(8px, env(safe-area-inset-bottom, 0px)); padding-top: 4px; }
  .dock { padding: 4px; }
  .seg button, .dbtn { padding: 7px 10px; }
}
@media (prefers-reduced-motion: reduce) { .panel { animation: none; } }
</style>
</head>
<body>
<canvas id="goo" aria-hidden="true"></canvas>
<canvas id="scene" aria-label="Interactive graphic. Move your cursor to play"></canvas>
<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <h1>clack<sup>10</sup></h1>
      <p id="hint">Move your cursor. Each sound draws its own picture</p>
    </div>
    <div class="tally" aria-live="off">
      <b id="count">0</b>
      <span>CLACKS</span>
    </div>
  </header>

  <main class="stage" id="stage"></main>

  <div class="dock-wrap" id="dockWrap">
    <nav class="dock" id="dock" aria-label="Settings">
      <div class="seg" role="group" aria-label="How it plays">
        <button id="modeHover" type="button" title="Plays as your cursor moves">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12c3-5 5 5 8 0s5 5 8 0"/></svg>
          <span class="lbl">Glide</span>
        </button>
        <button id="modeClick" type="button" title="Plays only while you click, tap or drag">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V10m0-1.5a1.5 1.5 0 0 1 3 0V11m0-1a1.5 1.5 0 0 1 3 0v4.5a5.5 5.5 0 0 1-5.5 5.5h-.8a5 5 0 0 1-4-2L5 14.5a1.5 1.5 0 0 1 2.3-1.9L9 14"/></svg>
          <span class="lbl">Tap</span>
        </button>
      </div>
      <span class="sep"></span>
      <button class="dbtn step" id="prev" type="button" aria-label="Previous sound"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg></button>
      <button class="dbtn" type="button" data-panel="sound" aria-expanded="false">
        <em id="soundNum">01</em><span id="soundName"></span>
      </button>
      <button class="dbtn step" id="next" type="button" aria-label="Next sound"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button>
      <span class="sep"></span>
      <button class="dbtn" type="button" data-panel="cursor" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 3v16l4.5-4.2 3.1 6.2 2.6-1.2-3-6.2H19z"/></svg>
        <span class="lbl">Cursor</span>
      </button>
      <span class="sep"></span>
      <div class="vol">
        <button class="dbtn" id="mute" type="button" aria-label="Mute" style="padding:9px"></button>
        <input id="volume" type="range" min="0" max="1" step="0.01" aria-label="Volume">
      </div>
    </nav>

    <section class="panel" id="panel-sound" hidden aria-label="Choose a sound">
      <h2>10 SOUNDS, 10 PICTURES</h2>
      <div class="grid" id="soundGrid"></div>
    </section>

    <section class="panel" id="panel-cursor" hidden aria-label="Style the cursor">
      <h2>CURSOR SHAPE</h2>
      <div class="grid" id="curGrid"></div>
      <h2>CURSOR COLOR</h2>
      <div class="swatches" id="curColors"></div>
      <h2>SIZE &amp; TRAIL</h2>
      <div class="row-line">
        <label for="curSize">Size</label>
        <input id="curSize" type="range" min="16" max="64" step="1">
        <button class="chip" id="tTrail" type="button">Trail</button>
      </div>
    </section>
  </div>
</div>

<canvas id="fx" aria-hidden="true"></canvas>
<div class="cursor" id="cursor" aria-hidden="true"></div>
<div class="toast" id="toast" role="status"></div>

<div class="intro" id="intro">
  <div class="intro-card">
    <small>A TOY ABOUT DOING NOTHING</small>
    <h2>clack</h2>
    <p>Move your cursor and every step clicks, pops or squishes.<br>Ten sounds, ten pictures to break, pour and squeeze.</p>
    <button class="go" id="go" type="button">Turn on sound &amp; start</button>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);

/* ---------- settings ---------- */
const SOUND_IDS = ['wax', 'popit', 'bubble', 'squishy', 'slime', 'sand', 'typewriter', 'gamered', 'voice', 'marimba'];
const OLD = { waxxl: 'wax', mix: 'wax', mochi: 'squishy', optical: 'gamered', gameclicky: 'gamered', chip: 'gamered',
  blue: 'typewriter', brown: 'typewriter', thock: 'typewriter', woodblock: 'typewriter' };
const DEF = { mode: 'hover', sound: 'wax', cur: 'ring', curColor: 'auto', curSize: 30, trail: true, volume: 0.7, muted: false, count: 0 };
let S = { ...DEF };
try { Object.assign(S, JSON.parse(localStorage.getItem('clack') || '{}')); } catch (e) {}
if (OLD[S.sound]) S.sound = OLD[S.sound];
if (!SOUND_IDS.includes(S.sound)) S.sound = DEF.sound;
let saveT = 0;
function save() {
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    try { const { mode, sound, cur, curColor, curSize, trail, volume, muted, count } = S; localStorage.setItem('clack', JSON.stringify({ mode, sound, cur, curColor, curSize, trail, volume, muted, count })); } catch (e) {}
  }, 300);
}

/* ---------- audio ---------- */
const A = { ctx: null };
function makeIR(C, secs, decay) {
  const len = Math.floor(C.sampleRate * secs), b = C.createBuffer(2, len, C.sampleRate);
  for (let ch = 0; ch < 2; ch++) { const d = b.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay); }
  return b;
}
function initAudio(C) {
  if (A.ctx && !C) { if (A.ctx.state === 'suspended') A.ctx.resume(); return; }
  C = C || new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
  A.ctx = C;
  A.master = C.createGain(); A.master.gain.value = S.muted ? 0 : S.volume;
  const comp = C.createDynamicsCompressor();
  comp.threshold.value = -16; comp.knee.value = 10; comp.ratio.value = 5; comp.attack.value = 0.002; comp.release.value = 0.15;
  A.dry = C.createGain(); A.dry.gain.value = 1.9; A.dry.connect(comp);
  A.wet = C.createGain(); A.wet.gain.value = 1.1;
  const verb = C.createConvolver(); verb.buffer = makeIR(C, 2.4, 3.4);
  A.wet.connect(verb); verb.connect(comp);
  // a gentle top-end roll-off keeps the tingle soft instead of sharp
  const soft = C.createBiquadFilter(); soft.type = 'lowpass'; soft.frequency.value = 10500; soft.Q.value = 0.5;
  comp.connect(soft); soft.connect(A.master); A.master.connect(C.destination);
  const n = C.createBuffer(1, C.sampleRate, C.sampleRate), d = n.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  A.noise = n;
}
function env(v, t, a, d, g) {
  v.gain.setValueAtTime(0.0001, t);
  v.gain.exponentialRampToValueAtTime(g, t + a);
  v.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
}
function out(v, wet) {
  v.connect(A.dry);
  if (wet) { const s = A.ctx.createGain(); s.gain.value = wet; v.connect(s); s.connect(A.wet); }
}
function tone(type, f, t, o = {}) {
  const { a = 0.002, d = 0.1, g = 0.5, f2 = 0, ft = 0.05, wet = 0 } = o;
  const C = A.ctx, osc = C.createOscillator(), v = C.createGain();
  osc.type = type; osc.frequency.setValueAtTime(f, t);
  if (f2) osc.frequency.exponentialRampToValueAtTime(f2, t + ft);
  env(v, t, a, d, g); osc.connect(v); out(v, wet);
  osc.start(t); osc.stop(t + a + d + 0.05);
}
function hiss(t, o = {}) {
  const { type = 'bandpass', f = 2000, q = 1, a = 0.001, d = 0.03, g = 0.5, f2 = 0, ft = 0.05, wet = 0 } = o;
  const C = A.ctx, s = C.createBufferSource(), fl = C.createBiquadFilter(), v = C.createGain();
  s.buffer = A.noise; s.playbackRate.value = 0.9 + Math.random() * 0.2;

    hit(x, y) { this.push(x, y, 3, 1, 0); },

/* ---------- UI ---------- */
const ICON_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const ICON_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 5 6M21 9l-5 6"/></svg>';

    b.type = 'button'; b.className = 'opt' + (cls ? ' ' + cls : ''); b.dataset.id = id;

function syncOptions(host, cur) { host.querySelectorAll('[data-id]').forEach(b => pressedAttr(b, b.dataset.id === cur)); }

function renderAll() {
  pressedAttr($('modeHover'), S.mode === 'hover'); pressedAttr($('modeClick'), S.mode === 'click');
  $('hint').textContent = S.mode === 'hover' ? 'Move your cursor. Each sound draws its own picture' : 'Click, tap or drag to play';
  setScene();
  $('soundNum').textContent = num(S.sound);
  $('soundName').textContent = SOUNDS[S.sound].name;
  syncOptions($('soundGrid'), S.sound); syncOptions($('curGrid'), S.cur);
  pressedAttr($('tTrail'), S.trail);
  $('curColors').querySelectorAll('[data-c]').forEach(b => pressedAttr(b, b.dataset.c === S.curColor));
  pressedAttr($('curPick'), !COLORS.includes(S.curColor));
  $('mute').innerHTML = S.muted ? ICON_OFF : ICON_ON;
  $('mute').setAttribute('aria-label', S.muted ? 'Unmute' : 'Mute');
  $('volume').value = S.volume;

  if ('volume' in patch || 'muted' in patch) { if (A.master) A.master.gain.setTargetAtTime(S.muted ? 0 : S.volume, A.ctx.currentTime, 0.02); if (S.muted && synth) synth.cancel(); }
  if ('mode' in patch || 'sound' in patch) releaseAll('p');

buildOptions($('soundGrid'), SOUNDS, pickSound,
  (id, s) => `<span class="thumb">${thumb(id)}</span><b><em>${num(id)}</em>${s.name}</b><span>${s.desc}</span>`);
function pickSound(id) { set({ sound: id }); if (id === 'voice' && !synth) toast("This browser can't read letters out loud"); demo(); }
function step(d) { const i = SOUND_IDS.indexOf(S.sound); pickSound(SOUND_IDS[(i + d + SOUND_IDS.length) % SOUND_IDS.length]); }
buildOptions($('curGrid'), CURSORS, id => set({ cur: id }),
  (id, c) => `<svg viewBox="0 0 24 24">${c.svg.replace(/stroke="#fff"/g, 'stroke="none"')}</svg><span>${c.name}</span>`, 'cur-opt');
COLORS.forEach(c => {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'sw' + (c === 'auto' ? ' auto' : ''); b.dataset.c = c;
  b.setAttribute('aria-label', c === 'auto' ? 'Match the picture' : c); b.title = c === 'auto' ? 'Match the picture' : c;

const pick = document.createElement('label'); pick.className = 'sw pick'; pick.id = 'curPick'; pick.title = 'Pick any color';

$('curColors').appendChild(pick);

$('modeHover').addEventListener('click', () => set({ mode: 'hover' }));
$('modeClick').addEventListener('click', () => set({ mode: 'click' }));
$('prev').addEventListener('click', () => step(-1));
$('next').addEventListener('click', () => step(1));
$('tTrail').addEventListener('click', () => set({ trail: !S.trail }));

$('volume').addEventListener('input', e => set({ volume: +e.target.value, muted: false }));

$('curSize').addEventListener('input', e => set({ curSize: +e.target.value }));

document.querySelectorAll('[data-panel]').forEach(b => b.addEventListener('click', () => {

/* a little preview swipe across the middle when a sound is picked */
function demo() {
  initAudio();
  const n = S.sound === 'voice' ? 3 : 6, gap = S.sound === 'voice' ? 420 : 110, my = (ZT + ZB) / 2;
  for (let i = 0; i < n; i++) setTimeout(() => {
    const k = cellAt(SW * (.38 + .24 * i / (n - 1)), my + Math.sin(i * 1.3) * CELL * .8);
    if (!k) return;
    press(k, 'demo'); setTimeout(() => release(k, 'demo'), 90);

/* ---------- start ---------- */
let started = false;
function start() {

  started = true;
  initAudio();
  $('intro').hidden = true;

$('go').addEventListener('click', e => { e.stopPropagation(); start(); });

addEventListener('resize', () => { fxResize(); sceneResize(); });
