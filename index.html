<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--artifact:start-->
<title>Clack Keyboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Glide your mouse across a giant keyboard and hear every key click. A stress-relief keyboard toy.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one screen. A keyboard case fills the viewport between a slim header and a floating dock;
   a giant echo of the last key flashes over it. Colors come from keycap palettes (tokens below). */
:root {
  --bg: #e3e7ee; --bg-2: #cdd4e0;
  --ink: #1f2633; --ink-soft: #5d6778; --line: rgba(31,38,51,.12); --panel: rgba(255,255,255,.76);
  --case: #eef1f6; --case-hi: #ffffff; --case-lo: #b9c2d1;
  --cap: #fbfcfe; --cap-hi: #ffffff; --cap-side: #c8cfdc; --legend: #2b3342;
  --mod: #dde3ec; --mod-hi: #e9eef5; --mod-side: #b3bccb; --mod-legend: #4a5466;
  --acc: #5b6cff; --acc-hi: #7886ff; --acc-side: #3743b8; --acc-legend: #ffffff; --glow: #5b6cff; --cursor: #5b6cff; --echo: rgba(91,108,255,.16);

  --font-display: "Bagel Fat One", "Rubik", system-ui, sans-serif;
  --font-ui: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-cap: "Rubik", system-ui, sans-serif;
  --u: 60px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1020; --bg-2: #18203a;
    --ink: #e6e9f5; --ink-soft: #9099b8; --line: rgba(230,233,245,.12); --panel: rgba(22,28,50,.8);
    --case: #161d33; --case-hi: #222b48; --case-lo: #05070f;
    --cap: #262f4d; --cap-hi: #313b5e; --cap-side: #121829; --legend: #dfe5ff;
    --mod: #1d2540; --mod-hi: #262f4f; --mod-side: #0c1120; --mod-legend: #9aa4c8;
    --acc: #3fd8e8; --acc-hi: #73e7f3; --acc-side: #168391; --acc-legend: #062026; --glow: #5fe3f0; --cursor: #5fe3f0; --echo: rgba(95,227,240,.14); --echo-blend: screen;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1020; --bg-2: #18203a;
  --ink: #e6e9f5; --ink-soft: #9099b8; --line: rgba(230,233,245,.12); --panel: rgba(22,28,50,.8);
  --case: #161d33; --case-hi: #222b48; --case-lo: #05070f;
  --cap: #262f4d; --cap-hi: #313b5e; --cap-side: #121829; --legend: #dfe5ff;
  --mod: #1d2540; --mod-hi: #262f4f; --mod-side: #0c1120; --mod-legend: #9aa4c8;
  --acc: #3fd8e8; --acc-hi: #73e7f3; --acc-side: #168391; --acc-legend: #062026; --glow: #5fe3f0; --cursor: #5fe3f0; --echo: rgba(95,227,240,.14); --echo-blend: screen;
  color-scheme: dark;
}
/* Keycap palettes picked in the Keyboard panel. */
body[data-kb="cloud"] {
  --bg: #e3e7ee; --bg-2: #cdd4e0; --ink: #1f2633; --ink-soft: #5d6778; --line: rgba(31,38,51,.12); --panel: rgba(255,255,255,.76);
  --case: #eef1f6; --case-hi: #ffffff; --case-lo: #b9c2d1; --cap: #fbfcfe; --cap-hi: #ffffff; --cap-side: #c8cfdc; --legend: #2b3342;
  --mod: #dde3ec; --mod-hi: #e9eef5; --mod-side: #b3bccb; --mod-legend: #4a5466; --acc: #5b6cff; --acc-hi: #7886ff; --acc-side: #3743b8; --acc-legend: #ffffff; --glow: #5b6cff; --cursor: #5b6cff; --echo: rgba(91,108,255,.16); --echo-blend: multiply; color-scheme: light;
}
body[data-kb="midnight"] {
  --bg: #0b1020; --bg-2: #18203a; --ink: #e6e9f5; --ink-soft: #9099b8; --line: rgba(230,233,245,.12); --panel: rgba(22,28,50,.8);
  --case: #161d33; --case-hi: #222b48; --case-lo: #05070f; --cap: #262f4d; --cap-hi: #313b5e; --cap-side: #121829; --legend: #dfe5ff;
  --mod: #1d2540; --mod-hi: #262f4f; --mod-side: #0c1120; --mod-legend: #9aa4c8; --acc: #3fd8e8; --acc-hi: #73e7f3; --acc-side: #168391; --acc-legend: #062026; --glow: #5fe3f0; --cursor: #5fe3f0; --echo: rgba(95,227,240,.14); --echo-blend: screen; color-scheme: dark;
}
body[data-kb="mint"] {
  --bg: #c4e6da; --bg-2: #9fcfbf; --ink: #2c1f1b; --ink-soft: #5b4a43; --line: rgba(44,31,27,.14); --panel: rgba(242,251,247,.8);
  --case: #4a3129; --case-hi: #5e4036; --case-lo: #22140f; --cap: #e3f6ef; --cap-hi: #f4fcf8; --cap-side: #a2cfbf; --legend: #3b2a24;
  --mod: #7a5547; --mod-hi: #8b6455; --mod-side: #452c23; --mod-legend: #f1e4dc; --acc: #5fcfae; --acc-hi: #82dcc1; --acc-side: #2b8c72; --acc-legend: #173229; --glow: #38c497; --cursor: #4a3129; --echo: rgba(56,196,151,.2); --echo-blend: multiply; color-scheme: light;
}
body[data-kb="retro"] {
  --bg: #b7beb4; --bg-2: #9aa398; --ink: #23251f; --ink-soft: #50554a; --line: rgba(35,37,31,.15); --panel: rgba(236,232,220,.84);
  --case: #d5cebb; --case-hi: #e6e0d0; --case-lo: #8f8774; --cap: #ebe5d6; --cap-hi: #f6f2e8; --cap-side: #b5ab94; --legend: #3a3a33;
  --mod: #9b978b; --mod-hi: #aba79b; --mod-side: #6a665b; --mod-legend: #f3efe4; --acc: #e0612f; --acc-hi: #ec7d50; --acc-side: #9f3e19; --acc-legend: #fff4ea; --glow: #e8692f; --cursor: #c4501f; --echo: rgba(224,97,47,.18); --echo-blend: multiply; color-scheme: light;
}
body[data-kb="sakura"] {
  --bg: #f6dfe6; --bg-2: #eec3d1; --ink: #3a2330; --ink-soft: #7a5868; --line: rgba(58,35,48,.12); --panel: rgba(255,247,250,.82);
  --case: #fff7fa; --case-hi: #ffffff; --case-lo: #dcaabc; --cap: #fff5f8; --cap-hi: #ffffff; --cap-side: #ebc4d1; --legend: #5a3446;
  --mod: #f6cad8; --mod-hi: #fad8e3; --mod-side: #d79db2; --mod-legend: #6e3a52; --acc: #e5588a; --acc-hi: #ef78a2; --acc-side: #ad3462; --acc-legend: #ffffff; --glow: #e5588a; --cursor: #d4467a; --echo: rgba(229,88,138,.18); --echo-blend: multiply; color-scheme: light;
}
body[data-kb="blackout"] {
  --bg: #d8d8d4; --bg-2: #bcbcb7; --ink: #151515; --ink-soft: #55554f; --line: rgba(21,21,21,.14); --panel: rgba(246,246,243,.84);
  --case: #141414; --case-hi: #222222; --case-lo: #000000; --cap: #1e1e1e; --cap-hi: #2a2a2a; --cap-side: #060606; --legend: #ededed;
  --mod: #2b2b2b; --mod-hi: #353535; --mod-side: #0b0b0b; --mod-legend: #b8b8b8; --acc: #f1f1ec; --acc-hi: #ffffff; --acc-side: #a3a39d; --acc-legend: #111111; --glow: #ffffff; --cursor: #111111; --echo: rgba(255,255,255,.12); --echo-blend: screen; color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden;
  background: radial-gradient(120% 90% at 50% 10%, var(--bg) 0%, var(--bg) 40%, var(--bg-2) 100%);
  background-color: var(--bg);
  color: var(--ink); font-family: var(--font-ui);
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  touch-action: none;
  transition: background-color .4s;
}
body.custom-cursor, body.custom-cursor * { cursor: none !important; }

.app {
  height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); position: relative;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Header */
.top {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding-block: 14px 6px; position: relative; z-index: 3;
}
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { margin: 0; font: 400 30px/1 var(--font-display); letter-spacing: .01em; color: var(--ink); }
.brand h1 i { font-style: normal; color: var(--acc); }
body[data-kb="blackout"] .brand h1 i { color: var(--ink); }
.brand p { margin: 0; font-size: 13px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tally { text-align: right; line-height: 1.1; }
.tally b { display: block; font: 600 24px/1 var(--font-cap); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.tally span { font-size: 11px; letter-spacing: .08em; color: var(--ink-soft); }

/* Stage + keyboard */
.stage { position: relative; display: grid; place-items: center; min-height: 0; min-width: 0; overflow: hidden; }
.echo {
  position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 2; opacity: 0;
  font: 400 min(56vh, 42vw)/1 var(--font-display); color: var(--echo); mix-blend-mode: var(--echo-blend, multiply); white-space: nowrap; overflow: hidden;
}
.case {
  position: relative; z-index: 1;
  padding: calc(var(--u) * .32);
  border-radius: calc(var(--u) * .46);
  background: linear-gradient(180deg, var(--case-hi), var(--case) 30%, var(--case));
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.35),
    inset 0 calc(var(--u) * -.06) 0 rgba(0,0,0,.12),
    0 calc(var(--u) * .1) 0 var(--case-lo),
    0 calc(var(--u) * .3) calc(var(--u) * .7) rgba(10,14,30,.28);
  transition: background .4s, box-shadow .4s;
}
.case::after { /* brand plate */
  content: "CLACK · 60%"; position: absolute; right: calc(var(--u) * .5); top: calc(var(--u) * .09);
  font: 500 calc(var(--u) * .12)/1 var(--font-cap); letter-spacing: .3em; color: var(--mod-legend); opacity: .45;
}
.row { display: flex; }
.row.fn { margin-bottom: calc(var(--u) * .22); }
.gap { flex: none; }
.key {
  --c-face: var(--cap); --c-hi: var(--cap-hi); --c-side: var(--cap-side); --c-leg: var(--legend);
  flex: none; height: var(--u); padding: calc(var(--u) * .04); position: relative;
}
.key.mod { --c-face: var(--mod); --c-hi: var(--mod-hi); --c-side: var(--mod-side); --c-leg: var(--mod-legend); }
.key.acc { --c-face: var(--acc); --c-hi: var(--acc-hi); --c-side: var(--acc-side); --c-leg: var(--acc-legend); }
.cap {
  position: relative; height: 100%;
  border-radius: calc(var(--u) * .15);
  background: linear-gradient(180deg, var(--c-face), var(--c-side) 115%);
  box-shadow:
    0 calc(var(--u) * .065) 0 var(--c-side),
    0 calc(var(--u) * .1) calc(var(--u) * .14) rgba(0,0,0,.22);
  transition: transform 70ms cubic-bezier(.3,.7,.4,1.6), box-shadow 70ms;
}
.cap::before { /* sculpted top face */
  content: ""; position: absolute;
  inset: calc(var(--u) * .04) calc(var(--u) * .075) calc(var(--u) * .13);
  border-radius: calc(var(--u) * .11);
  background: linear-gradient(165deg, var(--c-hi), var(--c-face) 70%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.25);
}
.cap::after { /* press glow */
  content: ""; position: absolute; inset: 0; border-radius: inherit; opacity: 0;
  background: radial-gradient(70% 70% at 50% 40%, color-mix(in srgb, var(--glow) 45%, transparent), transparent 75%);
  transition: opacity .35s;
}
.key.down .cap {
  transform: translateY(calc(var(--u) * .055));
  box-shadow: 0 calc(var(--u) * .012) 0 var(--c-side), 0 calc(var(--u) * .03) calc(var(--u) * .05) rgba(0,0,0,.2);
  transition-duration: 25ms;
}
.key.down .cap::after { opacity: 1; transition-duration: 0s; }
.lg, .tp {
  position: absolute; z-index: 1; pointer-events: none; color: var(--c-leg);
  font-family: var(--font-cap); line-height: 1;
}
.lg { left: calc(var(--u) * .2); top: calc(var(--u) * .16); font-size: calc(var(--u) * .28); font-weight: 500; }
.tp { left: calc(var(--u) * .2); top: calc(var(--u) * .15); font-size: calc(var(--u) * .18); opacity: .6; }
.key.num .lg { top: auto; bottom: calc(var(--u) * .24); }
.key.small .lg { top: auto; bottom: calc(var(--u) * .23); font-size: calc(var(--u) * .16); font-weight: 400; letter-spacing: .04em; }
.key.fk .lg { font-size: calc(var(--u) * .17); font-weight: 400; top: calc(var(--u) * .17); }

/* FX canvas + custom cursor */
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
.cursor {
  position: fixed; left: 0; top: 0; z-index: 50; pointer-events: none; color: var(--cursor);
  width: var(--cs, 28px); height: var(--cs, 28px); margin: calc(var(--cs, 28px) / -2) 0 0 calc(var(--cs, 28px) / -2);
  filter: drop-shadow(0 2px 3px rgba(0,0,0,.25)); will-change: transform; opacity: 0; transition: opacity .2s;
}
.cursor.on { opacity: 1; }
.cursor.tl { margin: -2px 0 0 -3px; }
.cursor svg { width: 100%; height: 100%; display: block; transition: transform 90ms ease-out; }
.cursor.press svg { transform: scale(.78); transition-duration: 30ms; }

/* Dock */
.dock-wrap {
  position: relative; z-index: 20; display: flex; justify-content: center;
  padding-bottom: max(14px, env(safe-area-inset-bottom, 0px)); padding-top: 6px;
}
.dock {
  display: flex; align-items: center; gap: 4px; padding: 6px; max-width: 100%;
  border-radius: 999px; background: var(--panel); border: 1px solid var(--line);
  backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4);
  box-shadow: 0 10px 30px rgba(10,14,30,.16);
  overflow-x: auto; scrollbar-width: none;
}
.dock::-webkit-scrollbar { display: none; }
.seg { display: flex; background: var(--line); border-radius: 999px; padding: 3px; flex: none; }
.seg button, .dbtn {
  font: 500 13px/1 var(--font-ui); color: var(--ink); background: transparent; border: 0;
  display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; flex: none;
  padding: 9px 13px; border-radius: 999px; cursor: pointer; transition: background .15s, color .15s;
}
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.dbtn:hover, .dbtn[aria-expanded="true"] { background: var(--line); }
.dbtn small { color: var(--ink-soft); font-size: 12px; font-weight: 400; }
.dbtn svg, .seg svg { width: 16px; height: 16px; flex: none; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
.sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; flex: none; }
.vol { display: flex; align-items: center; gap: 6px; padding-right: 8px; flex: none; }
input[type="range"] { accent-color: var(--ink); width: 92px; }

/* Panels */
.panel {
  position: absolute; bottom: calc(100% + 4px); left: 50%; transform: translateX(-50%);
  width: min(620px, calc(100vw - 32px)); max-height: min(62vh, 520px); overflow: auto;
  padding: 18px; border-radius: 22px; background: var(--panel); border: 1px solid var(--line);
  backdrop-filter: blur(22px) saturate(1.4); -webkit-backdrop-filter: blur(22px) saturate(1.4);
  box-shadow: 0 20px 50px rgba(10,14,30,.22);
  animation: rise .18s ease-out;
}
@keyframes rise { from { opacity: 0; transform: translate(-50%, 8px); } }
.panel h2 { margin: 0 0 12px; font: 600 12px/1 var(--font-ui); letter-spacing: .12em; color: var(--ink-soft); }
.panel h2 + * { margin-bottom: 18px; }
.panel > :last-child { margin-bottom: 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); gap: 8px; }
.opt {
  text-align: left; font: inherit; color: var(--ink); cursor: pointer;
  padding: 11px 12px; border-radius: 14px; border: 1px solid var(--line); background: transparent;
  display: flex; flex-direction: column; gap: 4px; transition: border-color .15s, background .15s;
}
.opt:hover { background: var(--line); }
.opt[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.opt b { font-size: 14px; font-weight: 600; }
.opt span { font-size: 12px; color: var(--ink-soft); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip {
  font: 500 13px/1 var(--font-ui); color: var(--ink); padding: 9px 13px; border-radius: 999px;
  border: 1px solid var(--line); background: transparent; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.sw {
  width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--panel); cursor: pointer; padding: 0;
  box-shadow: 0 0 0 1px var(--line);
}
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
.sw.auto { background: conic-gradient(#5b6cff, #3fd8e8, #5fcfae, #e0612f, #e5588a, #5b6cff); }
.sw.pick { position: relative; overflow: hidden; background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red); }
.sw.pick input { position: absolute; inset: -6px; width: 200%; height: 200%; opacity: 0; cursor: pointer; }
.pal { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 4px 10px; }
.pal .dots { grid-row: span 2; display: flex; }
.pal .dots i { width: 18px; height: 18px; border-radius: 50%; margin-right: -6px; box-shadow: 0 0 0 2px var(--panel); }
.cur-opt { align-items: center; text-align: center; }
.cur-opt svg { width: 26px; height: 26px; color: var(--ink); }
.row-line { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--ink-soft); }
.toggles { display: flex; flex-wrap: wrap; gap: 8px; }

/* Intro */
.intro {
  position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; text-align: center;
  background: color-mix(in srgb, var(--bg) 55%, transparent);
  backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.intro-card { max-width: 440px; display: grid; justify-items: center; gap: 14px; }
.intro h2 { margin: 0; font: 400 clamp(64px, 14vw, 120px)/.9 var(--font-display); color: var(--ink); text-wrap: balance; }
.intro h2 i { font-style: normal; color: var(--acc); }
body[data-kb="blackout"] .intro h2 i { color: var(--ink); }
.intro p { margin: 0; font-size: 15px; line-height: 1.6; color: var(--ink-soft); text-wrap: balance; }
.go {
  margin-top: 6px; font: 600 16px/1 var(--font-ui); padding: 16px 28px; border-radius: 999px; border: 0;
  background: var(--ink); color: var(--bg); cursor: pointer; box-shadow: 0 10px 24px rgba(10,14,30,.25);
}
.toast {
  position: fixed; left: 50%; top: max(70px, calc(env(safe-area-inset-top, 0px) + 60px)); transform: translateX(-50%);
  z-index: 30; padding: 10px 16px; border-radius: 999px; background: var(--ink); color: var(--bg); font-size: 13px;
  pointer-events: none; transition: opacity .3s; opacity: 0;
}
.toast.on { opacity: 1; }

@media (max-width: 720px) {
  .dbtn small, .dbtn .lbl, .brand p { display: none; }
  .seg button { padding: 9px 11px; }
  input[type="range"] { width: 64px; }
  .tally b { font-size: 20px; }
  .brand h1 { font-size: 26px; }
}
.rotate-hint { display: none; }
@media (max-width: 520px) and (orientation: portrait) {
  .rotate-hint {
    display: block; position: absolute; left: 0; right: 0; bottom: 12%; text-align: center;
    font-size: 13px; color: var(--ink-soft); pointer-events: none;
  }
  .vol input { display: none; }
}
@media (max-height: 520px) {
  .top { padding-block: 8px 2px; }
  .brand h1 { font-size: 22px; }
  .brand p { display: none; }
  .tally b { font-size: 18px; }
  .dock-wrap { padding-bottom: max(8px, env(safe-area-inset-bottom, 0px)); padding-top: 4px; }
  .dock { padding: 4px; }
  .seg button, .dbtn { padding: 7px 10px; }
  .dbtn small, .dbtn .lbl { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .cap, .cap::after, .panel { transition: none; animation: none; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <h1>cl<i>ack</i></h1>
      <p id="hint">Glide your cursor across the keys</p>
    </div>
    <div class="tally" aria-live="off">

<canvas id="fx" aria-hidden="true"></canvas>

<div class="intro" id="intro">
  <div class="intro-card">
    <h2>cl<i>ack</i></h2>
    <p>Glide your mouse over the keys and hear every one click.<br>Swap sounds, style your cursor, and tap the stress away.</p>
    <button class="go" id="go" type="button">Turn on sound &amp; start</button>
  </div>
</div>

<script>
(() => {
'use strict';

/* ---------- settings ---------- */
const SOUND_IDS = ['blue', 'brown', 'thock', 'typewriter', 'bubble', 'woodblock', 'marimba', 'chip', 'voice', 'mix'];
const DEF = { mode: 'hover', sound: 'blue', pal: 'auto', cur: 'ring', curColor: 'auto', curSize: 30, trail: true,
  fx: true, echo: true, volume: 0.7, muted: false, count: 0, zen: 0 };
let S = { ...DEF };
try { Object.assign(S, JSON.parse(localStorage.getItem('clack') || '{}')); } catch (e) {}
if (!SOUND_IDS.includes(S.sound)) S.sound = DEF.sound;
let saveT = 0;
function save() { clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem('clack', JSON.stringify(S)); } catch (e) {} }, 300); }

/* ---------- layout ---------- */
const NUM_EN = ['zero','one','two','three','four','five','six','seven','eight','nine'];
// [code, label, width, class, shiftLegend, spoken]
const K = (code, label, w = 1, cls = '', tp = '', en = '') => ({ code, label, w, cls, tp, en });
const G = w => ({ gap: w });
const ROWS = [
  [K('Escape','esc',1,'acc small','', 'escape'), G(1),
   ...[1,2,3,4].map(n => K('F'+n,'F'+n,1,'mod fk','', 'F '+n)), G(.5),
   ...[5,6,7,8].map(n => K('F'+n,'F'+n,1,'mod fk','', 'F '+n)), G(.5),
   ...[9,10,11,12].map(n => K('F'+n,'F'+n,1,'mod fk','', 'F '+n))],
  [K('Backquote','`',1,'num','~','tilde'),
   ...'1234567890'.split('').map((d,i) => K('Digit'+d, d, 1, 'num', '!@#$%^&*()'[i], NUM_EN[+d])),
   K('Minus','-',1,'num','_','minus'), K('Equal','=',1,'num','+','equals'),
   K('Backspace','backspace',2,'mod small','','backspace')],
  [K('Tab','tab',1.5,'mod small','','tab'),
   ...'QWERTYUIOP'.split('').map(c => K('Key'+c, c)),
   K('BracketLeft','[',1,'num','{','bracket'), K('BracketRight',']',1,'num','}','bracket'),
   K('Backslash','\\',1.5,'num','|','backslash')],
  [K('CapsLock','caps lock',1.75,'mod small','','caps lock'),
   ...'ASDFGHJKL'.split('').map(c => K('Key'+c, c)),
   K('Semicolon',';',1,'num',':','semicolon'), K('Quote',"'",1,'num','"','quote'),
   K('Enter','enter',2.25,'acc small','','enter')],
  [K('ShiftLeft','shift',2.25,'mod small','','shift'),
   ...'ZXCVBNM'.split('').map(c => K('Key'+c, c)),
   K('Comma',',',1,'num','<','comma'), K('Period','.',1,'num','>','dot'), K('Slash','/',1,'num','?','slash'),
   K('ShiftRight','shift',2.75,'mod small','','shift')],
  [K('ControlLeft','ctrl',1.25,'mod small','','control'), K('AltLeft','opt',1.25,'mod small','','option'),
   K('MetaLeft','cmd',1.25,'mod small','','command'), K('Space','',6.25,'','','space'),
   K('MetaRight','cmd',1.25,'mod small','','command'), K('AltRight','opt',1.25,'mod small','','option'),
   K('Fn','fn',1.25,'mod small','','function'), K('ControlRight','ctrl',1.25,'mod small','','control')]
];
const ALIAS = { IntlBackslash: 'Backslash', ContextMenu: 'Fn', OSLeft: 'MetaLeft', OSRight: 'MetaRight' };

const board = document.getElementById('board');
const keyEls = {};
const keyInfo = new WeakMap();
let seedN = 7;
const rnd = () => { seedN = (seedN * 16807) % 2147483647; return (seedN - 1) / 2147483646; };
ROWS.forEach((row, r) => {
  const rowEl = document.createElement('div');
  rowEl.className = 'row' + (r === 0 ? ' fn' : '');
  let x = 0;
  row.forEach(k => {
    if (k.gap) { const g = document.createElement('div'); g.className = 'gap'; g.style.width = `calc(var(--u) * ${k.gap})`; rowEl.appendChild(g); x += k.gap; return; }
    const el = document.createElement('div');
    el.className = 'key ' + k.cls;
    el.style.width = `calc(var(--u) * ${k.w})`;
    el.innerHTML = `<div class="cap">${k.tp ? `<span class="tp">${k.tp}</span>` : ''}<span class="lg">${k.label}</span></div>`;
    rowEl.appendChild(el);
    const info = { ...k, row: r, x: x + k.w / 2, big: k.w >= 1.75, seed: rnd(), holders: new Set(), downAt: 0, upT: 0, el };
    if (!info.en) info.en = k.label;
    keyInfo.set(el, info);
    keyEls[k.code] = info;
    x += k.w;
  });
  board.appendChild(rowEl);
});

/* sizing: one key unit fits 15u wide x ~6.9u tall in the stage */
let U = 60;
const stage = document.getElementById('stage');
function fit() {
  const w = stage.clientWidth, h = stage.clientHeight;
  U = Math.max(16, Math.min(96, Math.floor(Math.min((w - 4) / 15.64, (h - 16) / 7.05))));
  document.documentElement.style.setProperty('--u', U + 'px');
  fxResize();
}

/* ---------- audio ---------- */
const A = { ctx: null };
function makeIR(C, secs, decay) {
  const len = Math.floor(C.sampleRate * secs), b = C.createBuffer(2, len, C.sampleRate);
  for (let ch = 0; ch < 2; ch++) { const d = b.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay); }
  return b;
}
function initAudio(C) {
  if (A.ctx && !C) { if (A.ctx.state === 'suspended') A.ctx.resume(); return; }
  C = C || new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
  A.ctx = C;
  A.master = C.createGain(); A.master.gain.value = S.muted ? 0 : S.volume;
  const comp = C.createDynamicsCompressor();
  comp.threshold.value = -16; comp.knee.value = 10; comp.ratio.value = 5; comp.attack.value = 0.002; comp.release.value = 0.15;
  A.dry = C.createGain(); A.dry.gain.value = 1.9; A.dry.connect(comp);
  A.wet = C.createGain(); A.wet.gain.value = 1.1;
  const verb = C.createConvolver(); verb.buffer = makeIR(C, 1.8, 3);
  A.wet.connect(verb); verb.connect(comp);
  comp.connect(A.master); A.master.connect(C.destination);
  const n = C.createBuffer(1, C.sampleRate, C.sampleRate), d = n.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  A.noise = n;
}
function env(v, t, a, d, g) {
  v.gain.setValueAtTime(0.0001, t);
  v.gain.exponentialRampToValueAtTime(g, t + a);
  v.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
}
function out(v, wet) {
  v.connect(A.dry);
  if (wet) { const s = A.ctx.createGain(); s.gain.value = wet; v.connect(s); s.connect(A.wet); }
}
function tone(type, f, t, o = {}) {
  const { a = 0.002, d = 0.1, g = 0.5, f2 = 0, ft = 0.05, wet = 0 } = o;
  const C = A.ctx, osc = C.createOscillator(), v = C.createGain();
  osc.type = type; osc.frequency.setValueAtTime(f, t);
  if (f2) osc.frequency.exponentialRampToValueAtTime(f2, t + ft);
  env(v, t, a, d, g); osc.connect(v); out(v, wet);
  osc.start(t); osc.stop(t + a + d + 0.05);
}
function hiss(t, o = {}) {
  const { type = 'bandpass', f = 2000, q = 1, a = 0.001, d = 0.03, g = 0.5, f2 = 0, ft = 0.05, wet = 0 } = o;
  const C = A.ctx, s = C.createBufferSource(), fl = C.createBiquadFilter(), v = C.createGain();
  s.buffer = A.noise; s.playbackRate.value = 0.9 + Math.random() * 0.2;
  fl.type = type; fl.frequency.setValueAtTime(f, t); if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + ft); fl.Q.value = q;
  env(v, t, a, d, g); s.connect(fl); fl.connect(v); out(v, wet);
  s.start(t, Math.random() * 0.5); s.stop(t + a + d + 0.05);
}
const PENTA = [0, 2, 4, 7, 9];
function noteOf(k, base = 48) {
  const deg = Math.floor(k.x * 0.8) + (5 - k.row) * 2;
  return base + Math.floor(deg / 5) * 12 + PENTA[deg % 5];
}
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

const SOUNDS = {
  blue: { name: 'Clicky', desc: 'Crisp blue-switch click', fx: 'spark',
    down(k, t, j) {
      hiss(t, { f: 4300 * j, q: 1.4, d: 0.012, g: 2.3 });
      tone('square', 2500 * j, t, { d: 0.007, g: 0.07 });
      hiss(t + 0.003, { f: (k.big ? 650 : 1150) * j, q: 2.2, d: 0.045, g: 1.6 });
      if (k.big) hiss(t + 0.016, { f: 3000, q: 2, d: 0.012, g: 0.5 });
    },
    up(k, t, j) { hiss(t, { f: 3300 * j, q: 1.4, d: 0.01, g: 0.55 }); } },
  brown: { name: 'Tactile', desc: 'Soft brown-switch bump', fx: 'spark',
    down(k, t, j) {
      hiss(t, { f: 2100 * j, q: 1, d: 0.018, g: 1.6 });
      hiss(t + 0.002, { f: (k.big ? 450 : 720) * j, q: 1.8, d: 0.05, g: 2 });
      tone('sine', 320 * j, t, { f2: 180, ft: 0.04, d: 0.045, g: 0.4 });
    },
    up(k, t, j) { hiss(t, { f: 1900 * j, q: 1, d: 0.012, g: 0.35 }); } },
  thock: { name: 'Thock', desc: 'Deep, lubed linear', fx: 'spark',
    down(k, t, j) {
      hiss(t, { type: 'lowpass', f: (k.big ? 420 : 820) * j, q: 0.8, d: k.big ? 0.09 : 0.055, g: 1.4 });
      tone('sine', (k.big ? 120 : 200) * j, t, { f2: (k.big ? 70 : 115) * j, ft: 0.05, d: 0.07, g: 0.6 });
      hiss(t, { f: 2600, q: 1, d: 0.006, g: 0.2 });
    },
    up(k, t, j) { hiss(t, { type: 'lowpass', f: 1500 * j, q: 0.8, d: 0.025, g: 0.35 }); } },
  typewriter: { name: 'Typewriter', desc: 'Clack clack, ding on Enter', fx: 'spark',
    down(k, t, j) {
      if (k.code === 'Space') {
        hiss(t, { type: 'lowpass', f: 900, d: 0.05, g: 1 }); tone('sine', 80, t, { d: 0.08, g: 0.5 }); return;
      }
      hiss(t, { f: 2600 * j, q: 0.7, d: 0.025, g: 1.4 });
      tone('triangle', 1350 * j, t, { d: 0.06, g: 0.12 });
      tone('triangle', 3100 * j, t, { d: 0.03, g: 0.06 });
      tone('sine', 95, t, { a: 0.001, d: 0.06, g: 0.5 });
      if (k.code === 'Enter') {
        tone('sine', 2093, t + 0.02, { d: 1.4, g: 0.28, wet: 0.35 });
        tone('sine', 4200, t + 0.02, { d: 0.6, g: 0.07 });
        hiss(t + 0.08, { f: 700, f2: 3500, ft: 0.3, a: 0.03, d: 0.32, q: 1.2, g: 0.45 });
      }
    },
    up(k, t) { hiss(t, { f: 3800, q: 1, d: 0.008, g: 0.25 }); } },
  bubble: { name: 'Bubble Wrap', desc: 'Pop, pop, pop', fx: 'bubble',
    down(k, t, j) {
      const f0 = (k.big ? 150 : 260 + k.seed * 280) * j;
      tone('sine', f0, t, { f2: f0 * 2.7, ft: 0.06, a: 0.003, d: 0.085, g: 0.6, wet: 0.15 });
      hiss(t, { f: 1800, q: 3, d: 0.006, g: 0.4 });
    } },
  woodblock: { name: 'Wood Block', desc: 'Tok. Every tap earns +1 zen', fx: 'zen',
    down(k, t, j) {
      const f = 560 * (1 + (k.seed - 0.5) * 0.08) * j;
      tone('sine', f, t, { a: 0.001, d: 0.24, g: 0.75, wet: 0.3 });
      tone('sine', f * 2.73, t, { a: 0.001, d: 0.05, g: 0.18 });
      tone('triangle', f * 1.5, t, { a: 0.001, d: 0.03, g: 0.1 });
      hiss(t, { f: f * 2.2, q: 6, d: 0.02, g: 0.7 });
    } },
  marimba: { name: 'Marimba', desc: 'Every key is in tune', fx: 'ring',
    down(k, t, j) {
      const f = mtof(noteOf(k)) * (0.997 + j * 0.003);
      tone('sine', f, t, { a: 0.002, d: Math.max(0.25, 0.9 - f / 3500), g: 0.5, wet: 0.3 });
      tone('sine', f * 4, t, { a: 0.001, d: 0.06, g: 0.12 });
      tone('sine', f * 9.9, t, { a: 0.001, d: 0.015, g: 0.04 });
      hiss(t, { f: f * 3, q: 4, d: 0.008, g: 0.12 });
    } },
  chip: { name: '8-Bit', desc: 'Arcade blips', fx: 'pixel',
    down(k, t) {
      if (k.code === 'Space') { tone('triangle', 180, t, { f2: 45, ft: 0.12, d: 0.15, g: 0.7 }); hiss(t, { type: 'highpass', f: 6000, d: 0.03, g: 0.25 }); return; }
      const f = mtof(noteOf(k, 60));
      tone('square', f, t, { d: 0.05, g: 0.26 });
      tone('square', f * 1.5, t + 0.035, { d: 0.05, g: 0.2 });
      tone('square', f * 2, t + 0.07, { d: 0.08, g: 0.17 });
    } },
  voice: { name: 'Voice', desc: 'Says each key: A, B, C', fx: 'ring',
    down(k, t, j) {
      hiss(t, { type: 'lowpass', f: 900 * j, d: 0.035, g: 0.6 });
      speak(k);
    } },
  mix: { name: 'Shuffle', desc: 'A different sound per key', fx: 'mix',
    down(k, t, j) { SOUNDS[mixOf(k)].down(k, t, j); },
    up(k, t, j) { const s = SOUNDS[mixOf(k)]; if (s.up) s.up(k, t, j); } }
};
const MIX = ['blue', 'brown', 'thock', 'typewriter', 'bubble', 'woodblock', 'marimba', 'chip'];
const mixOf = k => MIX[Math.floor(k.seed * 9973) % MIX.length];

function playKey(k, phase) {
  if (!A.ctx || A.ctx.state !== 'running' || S.muted) { if (phase === 'down' && S.sound === 'voice' && !S.muted) speak(k); return; }
  const s = SOUNDS[S.sound], fn = s[phase];
  if (!fn) return;
  const j = 0.96 + Math.random() * 0.08;
  try { fn(k, A.ctx.currentTime + 0.002, j); } catch (e) {}
}

/* speech */
let voices = [];
const synth = window.speechSynthesis;
function loadVoices() { try { voices = synth.getVoices(); } catch (e) {} }
if (synth) { loadVoices(); synth.onvoiceschanged = loadVoices; }
let lastSpeak = 0;
function speak(k) {
  if (!synth || S.muted) return;
  const now = performance.now();
  const text = k.en.length === 1 ? k.en.toUpperCase() : k.en;
  if (!text) return;
  if (now - lastSpeak < 40) return;
  lastSpeak = now;
  try {
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    const v = voices.find(v => v.lang && v.lang.replace('_', '-').toLowerCase() === 'en-us') || voices.find(v => v.lang && v.lang.toLowerCase().startsWith('en'));
    if (v) u.voice = v;
    u.rate = 1.3; u.pitch = 1.1; u.volume = Math.min(1, S.volume * 1.2);
    synth.speak(u);
  } catch (e) {}
}

/* ---------- press / release ---------- */
const echo = document.getElementById('echo');
const countEl = document.getElementById('count');
const countLbl = document.getElementById('countLbl');
const MIN_DOWN = 70;
function press(k, src) {
  if (!started) start();
  const was = k.holders.size;
  k.holders.add(src);
  if (was) return;
  clearTimeout(k.upT);
  k.el.classList.add('down');
  k.downAt = performance.now();
  playKey(k, 'down');
  S.count++;
  if (S.sound === 'woodblock' || (S.sound === 'mix' && mixOf(k) === 'woodblock')) S.zen++;
  renderCount();
  save();
  const r = k.el.getBoundingClientRect();
  if (S.fx) burst(r.left + r.width / 2, r.top + r.height / 2, k);
  if (S.echo) showEcho(k);
  pulseCursor();
}
function release(k, src) {
  if (!k.holders.delete(src) || k.holders.size) return;
  playKey(k, 'up');
  const held = performance.now() - k.downAt;
  const rel = () => k.el.classList.remove('down');
  if (held < MIN_DOWN) k.upT = setTimeout(rel, MIN_DOWN - held); else rel();
}
function releaseAll(prefix) {
  Object.values(keyEls).forEach(k => [...k.holders].forEach(h => { if (!prefix || h.startsWith(prefix)) release(k, h); }));
  if (!prefix || prefix === 'p') active.clear();
}
function renderCount() {
  const zen = S.sound === 'woodblock';
  countEl.textContent = (zen ? S.zen : S.count).toLocaleString('en-US');
  countLbl.textContent = zen ? 'zen earned' : 'clacks';
}
let echoAnim;
function showEcho(k) {
  echo.textContent = k.code === 'Space' ? '␣' : k.label.length > 3 ? k.label.split(' ')[0] : k.label;
  try {
    if (echoAnim) echoAnim.cancel();
    echoAnim = echo.animate([{ transform: 'scale(.86)', opacity: 1 }, { transform: 'scale(1)', opacity: 1, offset: .3 }, { transform: 'scale(1.05)', opacity: 0 }],
      { duration: 1100, easing: 'cubic-bezier(.2,.7,.3,1)', fill: 'forwards' });
  } catch (e) {}
}

/* ---------- pointer input ---------- */
const active = new Map();   // pointerId -> key under it
const lastPt = new Map();
const pressed = new Set();
function keyAt(x, y) {
  const el = document.elementFromPoint(x, y);
  if (!el || !board.contains(el)) return null;
  const kEl = el.closest('.key');
  return kEl ? keyInfo.get(kEl) : null;
}
function enter(id, k) {
