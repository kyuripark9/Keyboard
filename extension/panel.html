<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clack</title>
<style>
/* the side panel is clack and nothing else; while it looks for clack on this computer it shows clack's paper */
html, body { height: 100%; margin: 0; background: #e6e6e6; }
iframe { display: block; width: 100%; height: 100%; border: 0; }
.off { position: fixed; inset: 0; display: grid; place-content: center; gap: 14px; padding: 24px; text-align: center;
  font: 400 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: #1b2a6b; background: #f3eee6; }
.off b { font: 800 26px/1 system-ui, -apple-system, sans-serif; letter-spacing: -.04em; }
.off button { justify-self: center; padding: 9px 16px; border: 1.5px solid #1b2a6b; border-radius: 999px; background: none;
  font: 600 13px/1 system-ui, -apple-system, sans-serif; color: inherit; cursor: pointer; }
.off button:hover { background: #1b2a6b; color: #f3eee6; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<iframe id="clack" title="clack" allow="autoplay; clipboard-write"></iframe>
<div class="off" id="off" hidden>
  <b>clack</b>
  <span>clack needs a connection to load here,<br>or clack on your Mac.</span>
  <button type="button" id="retry">Try again</button>
</div>
<script src="panel.js"></script>
</body>
</html>
